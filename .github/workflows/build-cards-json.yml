name: 由 cards.csv 生成 cards.json

# 只改卡牌内容（cards.csv）时才跑。改完 CSV 直接 push 就行，不用手动生成 JSON。
on:
  push:
    branches: [main]
    paths:
      - 'cards.csv'
      - 'tools/csv2json.py'
      - '.github/workflows/build-cards-json.yml'
  workflow_dispatch:

# 需要往回提交生成的 cards.json / index.html
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 转换并校验
        run: python3 tools/csv2json.py

      - name: 有改动就提交回去
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- cards.json index.html; then
            echo "cards.json 无变化，跳过提交"
            exit 0
          fi
          git add cards.json index.html
          git commit -m "chore: 由 cards.csv 重新生成 cards.json 与内置兜底数据"
          git push
