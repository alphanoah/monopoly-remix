name: 重新生成页面

# 改了 content/ 下的真源（卡牌 cards.csv、规则 rules.md / new-rule.md、道具 props.md、原版资料 original/*）就自动跑，不用手动生成
on:
  push:
    branches: [main]
    paths:
      - 'content/cards.csv'
      - 'content/rules.md'
      - 'content/new-rule.md'
      - 'content/props.md'
      - 'content/original/**'
      - 'content/map-print-data.json'          # 棋盘真源：改了要重算兜底与首页/ README 的统计
      - 'tools/update.py'
      - '.github/workflows/build-pages.yml'
  workflow_dispatch:

# 需要往回提交生成的 cards.json / props.json / index.html / print.html / original.html
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 转换并生成页面
        run: python3 tools/update.py

      - name: 有改动就提交回去
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/cards.json data/props.json README.md index.html print.html original.html map-print-svg.html; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git add data/cards.json data/props.json README.md index.html print.html original.html map-print-svg.html
          git commit -m "chore: 由 cards.csv / docs 规则 / original/ 重新生成页面"
          git push
