<script>
const NS="http://www.w3.org/2000/svg";
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function tx(x,y,s,fs,o){o=o||{};const t=el("text",{x:x,y:y,"font-size":fs,
  "font-family":"-apple-system,PingFang SC,Microsoft YaHei,sans-serif",
  "font-weight":o.w||400,fill:o.fill||"#333","text-anchor":"middle","dominant-baseline":"middle"});
  t.textContent=s;return t;}
function isSpecial(t){return t[2]==="corner"||t[2]==="chance"||t[2]==="destiny"||t[2]==="ocean";}

function drawTile(g,t,x,y,w,h){
  if(isSpecial(t)){
    let bg="#fff",st="#e5e1da",sw=1;
    if(t[2]==="corner"){bg="#f4f2ee";st="#b3afa6";sw=2;}
    else if(t[2]==="chance"){bg="#faf3f6";st="#B06F88";}
    else if(t[2]==="destiny"){bg="#faf5ec";st="#D9BA8E";}
    else if(t[2]==="ocean"){bg="#eef3f6";st="#9BB6C4";}
    g.appendChild(el("rect",{x:x,y:y,width:w,height:h,fill:bg,stroke:st,"stroke-width":sw,rx:2}));
    const fs=Math.max(3,Math.min(w*0.26,h*0.26));
    const hasSub=!!t[3];
    g.appendChild(tx(x+w/2,y+h/2-(hasSub?h*0.16:0),t[0],fs,{w:600,fill:t[2]==="chance"?"#96597A":(t[2]==="destiny"?"#7A6338":(t[2]==="ocean"?"#4a6b7c":"#2c2c2a"))}));
    if(hasSub) g.appendChild(tx(x+w/2,y+h/2+h*0.22,t[3],fs*0.62,{w:600,fill:"#96597A"}));
  }else{
    g.appendChild(el("rect",{x:x,y:y,width:w,height:h,fill:"#fff",stroke:"#e5e1da","stroke-width":1,rx:2}));
    const bandH=Math.max(5,h*0.16);
    g.appendChild(el("rect",{x:x,y:y,width:w,height:bandH,fill:COLORS[t[2]]||"#ccc",rx:2}));
    const cx=x+w/2;
    const nf=Math.max(3,Math.min(w*0.185,h*0.24));
    let cy=y+bandH+nf*0.95;
    g.appendChild(tx(cx,cy,t[0],nf,{w:700,fill:"#2c2c2a"}));
    cy+=nf*0.98;
    g.appendChild(tx(cx,cy,"$"+t[1],nf*0.94,{w:700,fill:"#96597A"}));
    if(t[3]){cy+=nf*0.88;g.appendChild(tx(cx,cy,t[3],nf*0.60,{fill:"#8a8880"}));}
  }
}

function ringPos(id,cols,rows){const L=cols-1;
  if(id<=L) return {c:L-id,r:L};
  if(id<=2*L) return {c:0,r:2*L-id};
  if(id<=3*L) return {c:id-2*L,r:0};
  return {c:L,r:id-3*L};}
function snakePos(id,cols){const r=Math.floor(id/cols),p=id%cols;
  return {c:(r%2===0)?p:cols-1-p,r:r};}

function render(cfg){
  const cols=cfg.cols,rows=cfg.rows,tw=cfg.tw,th=cfg.th,gap=1;
  const W=cols*tw+(cols+1)*gap,H=rows*th+(rows+1)*gap;
  const svg=el("svg",{viewBox:"0 0 "+W+" "+H,preserveAspectRatio:"xMidYMid meet"});
  svg.appendChild(el("rect",{x:0,y:0,width:W,height:H,fill:"#f4f2ee",rx:4}));
  if(cfg.center){
    const cx=gap+tw,cy=gap+th,cw=(cols-2)*tw+(cols-3)*gap,ch=(rows-2)*th+(rows-3)*gap;
    svg.appendChild(el("rect",{x:cx,y:cy,width:cw,height:ch,fill:"#fbfaf8",stroke:"#e8e5df","stroke-width":1,rx:2}));
    svg.appendChild(tx(cx+cw/2,cy+ch/2-8,"世界之旅",24,{w:700,fill:"#2c2c2a"}));
    svg.appendChild(tx(cx+cw/2,cy+ch/2+16,"WORLD TOUR",12,{fill:"#8a8880"}));
  }
  TILES.forEach(function(t,id){
    const p=cfg.pos(id,cols,rows);
    const x=gap+p.c*(tw+gap),y=gap+p.r*(th+gap);
    const g=el("g",{});
    drawTile(g,t,x,y,tw,th);
    svg.appendChild(g);
  });
  return svg;
}

const CARDS=[
 {tag:"现状",grey:true,title:"A · 现在的样子（空心环）",
  meta:"板子 17 格并排，中间一整块是空的。缩到手机宽度后，<b>每格只有约 20px 宽</b>，国名/价格约 <b>3~4px</b> —— 基本看不清。",
  cfg:{cols:17,rows:17,tw:76,th:100,pos:ringPos,center:true},ruler:"整板 17×17 · 中间 15×15 全空"},
 {tag:"格子约 2×",title:"B · 铺满 8 列（中空消失）",
  meta:"把 64 格按行进顺序蛇形铺满，中间的空白被格子填满 → <b>每格约 42px</b>，字号约 <b>8px</b>，手机上能读。代价：不再是「绕圈」的环，得像看表格一样顺着看。",
  cfg:{cols:8,rows:8,tw:158,th:158,pos:function(id,c){return snakePos(id,c);}},ruler:"8 列 × 8 行铺满 · 无中空"},
 {tag:"格子约 3×",title:"C · 铺满 6 列（最清楚）",
  meta:"同上但只排 6 列、格子取正方 → <b>每格约 57px</b>，字号约 <b>10~11px</b>，接近正常阅读大小。代价：板子变长，手机上一屏差一点放不下，要稍微上下滑。",
  cfg:{cols:6,rows:11,tw:212,th:212,pos:function(id,c){return snakePos(id,c);}},ruler:"6 列 × 11 行 · 字最大，板子最长"}
];

const row=document.getElementById("row");
CARDS.forEach(function(c){
  const card=document.createElement("div");card.className="card";
  const h2=document.createElement("h2");
  h2.appendChild(document.createTextNode(c.title));
  const tg=document.createElement("span");tg.className="tag"+(c.grey?" grey":"");tg.textContent=c.tag;
  h2.appendChild(tg);card.appendChild(h2);
  const m=document.createElement("div");m.className="meta";m.innerHTML=c.meta;card.appendChild(m);
  const ph=document.createElement("div");ph.className="phone";ph.appendChild(render(c.cfg));card.appendChild(ph);
  const rl=document.createElement("div");rl.className="ruler";rl.textContent=c.ruler;card.appendChild(rl);
  row.appendChild(card);
});

document.getElementById("foot").innerHTML=
 "三种做法你更偏向哪种？<br><b>B / C（铺满）</b>是真的能解决手机看不清，但会丢掉「环游世界一圈」的棋盘观感；"+
 "如果你更想保留环形棋盘的样子，我也可以做<b>「环形不变、手机上默认放大 + 拖动看」</b>的方案，只是那样一次看不全整块板。<br>定了方向我再改 map-svg.html 正式代码。";
</script>
