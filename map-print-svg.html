<style>

    color: #2c2c2a;

  }
  .home {

  }
  .home:hover { color: #96597A; }
  .toolbar {
    display: flex;
    gap: 8px;

  .toolbar button {
    background: #fff;
    border: 1px solid #ddd9d2;
    border-radius: 8px;
    padding: 6px 13px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    color: #2c2c2a;
    transition: all 0.15s;
  }
  .toolbar button:hover { border-color: #B06F88; color: #96597A; }
  .toolbar button:active { background: #f4f2ee; }
  /* 下载按钮：给它一点主色，跟其余按钮区分开 */
  .toolbar button.primary { background: #B06F88; border-color: #B06F88; color: #fff; }
  .toolbar button.primary:hover { background: #96597A; border-color: #96597A; color: #fff; }
  .toolbar button.primary:active { background: #854f6c; border-color: #854f6c; }
  .toolbar button[disabled], .toolbar button.busy { opacity: .55; cursor: default; }
  /* 加厚环模式下整板一屏放得下，不需要缩放控件 */
  .svg-container {
    background: #fff;
    padding: 8px;
    border: 1px solid #e8e5df;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    width: 100%;
    max-width: 780px;      /* 环厚的板子是正方形，再宽手机上字会太小 */
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    position: relative;
  }
  /* 加厚环：视图固定，不缩放也不平移。放开 touch-action，手指在棋盘上滑动才能正常滚页面 */
  .svg-container.locked { cursor: default; touch-action: auto; }

  .legend {

    justify-content: center;
    align-items: center;

  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    border: 1px solid #e5e1da;
    border-radius: 999px;
    padding: 4px 11px;

    font-size: 12.5px;
    color: #6b6a66;
    cursor: pointer;

    font-size: 12px;

    margin-top: 10px;
    text-align: center;

  .seg-btn.on {

  @media (max-width: 640px) {
    body { padding: 10px 6px 28px; }

    .svg-container { padding: 4px; border-radius: 8px; }
    .legend-label { min-width: 0; }
    .toolbar { gap: 6px; padding: 7px 8px; }

<script>
// ===== 颜色映射 =====
// 色值一律从 map-print-data.json 读：国家色带 = colorGroups[].hex，机会/命运 = decks[].bg，
// 其余特殊格 = tileTypes[].hex（用 deck 字段指回 decks 时就不重复写同一个颜色）。
let DATA = null;         // 当前数据（fetch 拿到的真源，或内置兜底）
let HEX = {};            // 颜色组 id → 色值
let HEXBYKEY = {};       // 颜色组 key（如 "red"）→ 色值
function loadPalette(data) {
  HEX = {}; HEXBYKEY = {};
  (data.colorGroups || []).forEach(g => { HEX[g.id] = g.hex; HEXBYKEY[g.key] = g.hex; });
}
// 地产格：按 colorId（现在的数据）或 color 字符串（没 colorId 的老数据）取所在组的色值
function tileColor(t) {
  return (t.colorId != null ? HEX[t.colorId] : HEXBYKEY[t.color]) || specialColor(t.type);
}
// 特殊格（非地产）的色值：tileTypes 里要么直接给 hex，要么用 deck 指回 decks
function specialColor(type) {
  const tt = ((DATA && DATA.tileTypes) || {})[type] || {};
  if (tt.deck && DATA.decks && DATA.decks[tt.deck]) return DATA.decks[tt.deck].bg;
  return tt.hex || "#b3afa6";
}
// 数据的地产格也带 type:"property"，判断「是不是特殊格」得排除它
function isSpecial(t) { return !!t.type && t.type !== "property"; }
// 有几格（图例用；JSON 不存这些派生数字，全部现算）
function countOf(pred) { return DATA.tiles.filter(pred).length; }

const SVG_NS = "http://www.w3.org/2000/svg";

// ===== 布局参数 =====
// 结构照旧：每边 16 格（角格 + 15）、角格仍在四角、顺时针、首尾接壤；
// 只是把环「加厚」：每个格子沿径向往中间伸长 RING_T 个单位，中间的空被吃掉，格子随之变大。
const N_POS = 17;                                 // 每边的位置数（角格 + 15 + 角格）
const U = 20;                                     // 1 个单位 = 20 用户坐标（整板 340）
const RING_T = 4;                                 // 加厚环的环厚（1 = 薄环；1~8 任意取值）
const SVG_W = N_POS * U;                          // 加厚环整板正方形 = 340
const SVG_H = SVG_W;

// 中空边长 = 整板 − 两侧环厚（随 RING_T 变化，所以做成函数）
function holeSize() { return (N_POS - 2 * RING_T) * U; }

// ===== 格子位置：每边 16 格（角格 + 15），顺时针 =====
// 赤道(右下·起点) → 底边向左 → 地中海(左下) → 左边向上 → 北极(左上) → 顶边向右 → 夏威夷(右上) → 右边向下 → 回起点
function tileRectUnit(id) {
  const L = N_POS - 2 * RING_T, ew = L / 15;
  if (id === 0)  return { x: N_POS - RING_T, y: N_POS - RING_T, w: RING_T, h: RING_T };
  if (id <= 15) { const k = id - 1;  return { x: N_POS - RING_T - (k + 1) * ew, y: N_POS - RING_T, w: ew, h: RING_T }; }
  if (id === 16) return { x: 0, y: N_POS - RING_T, w: RING_T, h: RING_T };
  if (id <= 31) { const k = id - 17; return { x: 0, y: N_POS - RING_T - (k + 1) * ew, w: RING_T, h: ew }; }
  if (id === 32) return { x: 0, y: 0, w: RING_T, h: RING_T };
  if (id <= 47) { const k = id - 33; return { x: RING_T + k * ew, y: 0, w: ew, h: RING_T }; }
  if (id === 48) return { x: N_POS - RING_T, y: 0, w: RING_T, h: RING_T };
  const k = id - 49; return { x: N_POS - RING_T, y: RING_T + k * ew, w: RING_T, h: ew };
}
// 色带贴「最外圈」那一边：四个角格各接自己那一条边，整圈连成一条
function tileEdge(id) {
  if (id <= 15) return "bottom";   // 赤道(0) + 底边
  if (id <= 31) return "left";     // 地中海(16) + 左边
  if (id <= 47) return "top";      // 北极(32) + 顶边
  return "right";                  // 夏威夷(48) + 右边
}
// 三种排法里取字号最大的：竖排（字叠起来）/ 横排两行 / 横排一行
function pickText(name, price, W, H) {
  const n = name.length, pl = price ? price.length : 0;
  const stackPrice = price ? (W * 0.94 / (pl * 0.58 + 0.2) < 6.5) : false;
  const kP = price ? (stackPrice ? pl * 1.08 * 0.92 * 0.95 : 1.9) : 0.25;
  const c = [
    { m: "v",  f: Math.min(W * 0.84, H * 0.94 / (n * 1.08 + kP)), stackPrice: stackPrice },
    { m: "h2", f: Math.min(W * 0.94 / Math.max(1, n), H * 0.465) },
    { m: "h1", f: Math.min(W * 0.94 / (n + pl * 0.58 + 0.3), H * 0.80) }
  ].sort(function (a, b) { return b.f - a.f; })[0];
  c.f = Math.max(3, Math.min(c.f, 15));
  return c;
}

// ===== SVG 辅助函数 =====
function svgEl(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    el.setAttribute(k, v);
  }
  return el;
}

function svgText(x, y, text, fontSize, opts = {}) {
  const t = svgEl("text", {
    x: x,
    y: y,
    "font-size": fontSize,
    "font-family": opts.fontFamily || "-apple-system, PingFang SC, Microsoft YaHei, sans-serif",
    "font-weight": opts.weight || "normal",
    fill: opts.color || "#333",
    "text-anchor": "middle",
    "dominant-baseline": "middle"
  });
  if (opts.letterSpacing) t.setAttribute("letter-spacing", opts.letterSpacing);
  t.textContent = text;
  return t;
}

// ===== 图例筛选 =====
let currentFilter = "all";
let mapData = null;                               // 缓存当前数据，切换布局时用它重画
let hashApplied = false;                          // #f= 的hash筛选只吃一次

// 顶上的提示语随布局而变：加厚环一屏放下不用缩放，薄环才需要那套操作
function defaultHint() {
  if (isPrintZoom()) {
    return "放大版 · 还是打印版那张图，但跑道加厚吃进中间空、文字竖排放大 · 整板一屏放下 · 悬停看首都和价格 · 点下方色块只看某一组";
  }
  if (isPrintMode()) {
    return "打印版 · 按实体棋盘一比一还原的 80cm 软垫图 · 整板一屏放下 · 悬停看首都和价格 · 点「打印」直接出 800×800mm（勾「背景图形」）· 点下方色块只看某一组";
  }
  return "加厚环 · 整板已固定一屏，不用缩放平移 · 鼠标悬停看首都和价格 · 点下方色块只看某一组";
}

function setFilter(key, name) {
  currentFilter = (key === currentFilter) ? "all" : key;   // 再点一次就取消
  applyFilter(name);
}

// 把当前 currentFilter 落到棋盘上（重画之后也要重新调用一次）
function applyFilter(name) {
  document.querySelectorAll(".legend-item").forEach(el => {
    el.classList.toggle("on", el.dataset.filter === currentFilter);
  });
  const pair = currentFilter.split(":");
  const kind = pair[0], val = pair[1];
  let hits = 0;
  document.querySelectorAll("g[data-tile]").forEach(g => {
    const match = currentFilter === "all" ||
      (kind === "color" ? g.getAttribute("data-color") === val : g.getAttribute("data-special") === val);
    g.setAttribute("opacity", match ? "1" : "0.12");
    if (match) hits++;
  });
  const hint = document.getElementById("hint");
  if (currentFilter === "all") {
    hint.textContent = defaultHint();
    return;
  }
  const label = name || (currentFilter.split(":")[1] || "");
  hint.innerHTML = `只看 <b>${label}</b> · ${hits} 格 —— 再点一次取消筛选`;
}

// 按钮文字 / 缩放控件的显示，跟着当前布局走
function updateModeUI() {
  const thick = isRingThick(), print = isPrintMode(), zoom = isPrintZoom();
  // 三档都是正方板：加厚环 780 就够（板小字大），打印版/放大版放开到 900
  const container = document.getElementById("svg-container");
  container.style.maxWidth = thick ? "780px" : "900px";

function el(tag, attrs, children) {

// —— 大富翁（正中）——

function silverTitle(x, y, str, size) {
  const g = el("g");

// —— 卡牌背面样式的两个卡堆（样式完全照 print.html 卡牌背面）——
function cardBack(x, y, w, h, kind, rot) {
  const m = DECKS[kind];

  dv.appendChild(el("path", { d:"M8 8 Q6 2 11 0 Q10 6 14 8 Z", fill:m.fg }));

  dv.appendChild(el("path", { d:"M20 6 C11 6 5 12 5 19 C5 26 11 30 20 30 C29 30 35 26 35 19 C35 12 29 6 20 6 Z", fill:m.fg }));

// ===== 跑道格子 =====
// 四边的整格旋转角（底 0 / 左 +90 / 顶 180 / 右 -90），放大版的内容反向旋转要用
const ROTV = { bottom: 0, left: 90, top: 180, right: -90 };
// 四边同一套设计：色带在靠圆心一侧，内容依次 编号→国名→英文→国旗→$价格→首都，
// 整格旋转：底 0° / 左 +90° / 顶 180° / 右 -90°（与原版照片一致）
function tileGroup(col, row, side) {
  let cx, cy, rot;
  if (side === "top")         { cx = B + (col-1)*W + W/2; cy = B/2;              rot = 180; }
  else if (side === "bottom") { cx = B + (col-1)*W + W/2; cy = L - B/2;           rot = 0;   }
  else if (side === "left")   { cx = B/2;                 cy = B + (row-1)*W + W/2; rot = 90; }
  else if (side === "right")  { cx = L - B/2;             cy = B + (row-1)*W + W/2; rot = -90; }
  else if (col===0 && row===0)   { cx = B/2;   cy = B/2;   rot = 0; }
  else if (col===16 && row===0)  { cx = L-B/2; cy = B/2;   rot = 0; }
  else if (col===0 && row===16)  { cx = B/2;   cy = L-B/2; rot = 0; }
  else                           { cx = L-B/2; cy = L-B/2; rot = 0; }  // 赤道
  return el("g", { transform:`translate(${cx},${cy}) rotate(${rot})` });
}
// 局部坐标：x∈[-TW,TW]，y∈[-TH,TH]，色带在 y=-TH 一端（即靠圆心一侧）
function propertyContent(g, id, name, nameEn, flag, capital, price, colorId) {

    const [y1, y2, y3] = LP.longNameY || [-40, -24, -8];

    g.appendChild(txt(0, y2, name.slice(4), 13, { weight:"bold", fill:"#111" }));

// ===== 放大版：格子内容 =====
// 跑道加厚之后格子是「窄而深」的（宽 ~44、深 ~570），横排塞不下几个字，
// 所以参考加厚环：格子不旋转、文字全部正立 —— 底/顶边竖排（一字一行），
// 左/右边横排（一行排开），字号按格子大小自适应，短名字的字更大。
// 色带贴「靠圆心」的一端（与打印版同一个约定），只是不再靠旋转、改按 side 直接摆。

// 色带矩形（内容坐标系 = 屏幕方向，格心为原点；格子本身仍按打印版整格旋转）
function zoomBandRect(side) {
  // 注意左右边：径向是屏幕 x（半长 TH），沿边是屏幕 y（半宽 TW）—— 跟顶/底边正好互换
  if (side === "top")   return { x: -TW, y: TH - BAND, width: W, height: BAND };   // 顶边：圆心在下
  if (side === "left")  return { x: TH - BAND, y: -TW, width: BAND, height: W };   // 左边：圆心在右
  if (side === "right") return { x: -TH, y: -TW, width: BAND, height: W };         // 右边：圆心在左
  return { x: -TW, y: -TH, width: W, height: BAND };                               // 底边：圆心在上
}
// 内容可用区（色带对面那一头）
function zoomContentBox(side) {
  if (side === "top")    return { x0: -TW + 2, x1: TW - 2, y0: -TH + 6, y1: TH - BAND - 6 };
  if (side === "bottom") return { x0: -TW + 2, x1: TW - 2, y0: -TH + BAND + 6, y1: TH - 6 };
  if (side === "left")   return { x0: -TH + 6, x1: TH - BAND - 6, y0: -TW + 2, y1: TW - 2 };
  return { x0: -TH + BAND + 6, x1: TH - 6, y0: -TW + 2, y1: TW - 2 };               // right
}
// rows: [{ text, k(字号倍率), w(横排时字符宽度倍率), opts }]；vertical=竖排（底/顶边）
function zoomFlow(g, rows, box, vertical) {
  const LINE = 1.06, INNER = 0.12, GROUP = 0.34;
  const widthK = ZL.widthK || 0.94;
  let units = 0;
  rows.forEach(r => {
    const n = (r.text || "").length;
    if (!n) return;
    units += vertical
      ? n * r.k * LINE + (n - 1) * r.k * INNER + GROUP
      : n * r.k * (r.w || 1) + GROUP;
  });
  if (!units) return;
  units -= GROUP;                                   // 最后一组后面不加间距
  const f = vertical
    ? Math.max(6, Math.min((box.x1 - box.x0) * widthK, (box.y1 - box.y0) / units))
    : Math.max(6, Math.min((box.y1 - box.y0) * widthK, (box.x1 - box.x0) / units));
  let pos = (vertical ? box.y0 : box.x0)
    + ((vertical ? box.y1 - box.y0 : box.x1 - box.x0) - units * f) / 2;   // 沿长轴居中
  rows.forEach((r, ri) => {
    const n = (r.text || "").length;
    if (!n) return;
    const fs = f * r.k;
    if (ri) pos += f * GROUP;
    if (vertical) {
      const lh = fs * LINE;
      for (let i = 0; i < n; i++) {
        g.appendChild(txt(0, pos + lh / 2, r.text[i], fs, r.opts || {}));
        pos += lh + fs * INNER;
      }
    } else {
      const wpx = n * fs * (r.w || 1);
      g.appendChild(txt(pos + wpx / 2, 0, r.text, fs, r.opts || {}));
      pos += wpx + fs * INNER;
    }
  });
}
// 地产格四行的内容定义（竖排/横排共用）
function zoomRows(name, flag, price, capital) {
  return [
    { text: name || "", k: 1, w: 1.0, opts: { weight: "bold", fill: "#111" } },
    { text: flag || "🏳️", k: ZL.flagK || 0.95, w: 1.15, opts: {} },
    { text: price ? "$" + price : "", k: ZL.priceK || 0.62, w: 0.66, opts: { weight: "bold", fill: "#1a55a5" } },
    { text: capital || "", k: ZL.capitalK || 0.42, w: 0.6, opts: { fill: "#444" } }
  ];
}

(DATA.tiles || []).forEach(t => {
  const id = t.id, col = t.col, row = t.row, side = t.side, type = t.type;
  const name = t.name, nameEn = t.nameEn;
  const capital = t.capital, price = t.price, colorId = t.colorId;
  if ((type || "property") === "property" && !t.flag) warnNoFlag(t);
  const g = tileGroup(col, row, side);
  // 筛选标记：跟另外两档布局用同一套属性，图例筛选才能三档通用
  g.setAttribute("data-tile", "1");
  if ((type || "property") === "property") g.setAttribute("data-color", GKEY[colorId] || t.color || "");
  else g.setAttribute("data-special", type);
  const tip = el("title", {});
  tip.textContent = `${name}${nameEn ? " " + nameEn : ""}` +
    `${capital ? " · 首都 " + capital : ""}${price ? " · $" + price : ""}`;
  g.appendChild(tip);

  if (type === "corner") {
    // 角格内容是按「跑道宽 190」画的，放大版整体 scale 一下就跟着变大（B=570 → ×3）
    const cg = ZOOM ? el("g", { transform:`scale(${B / 190})` }) : g;
    const RB = ZOOM ? 190 : B, RT = ZOOM ? 95 : TH;  // 基准尺寸：scale 之前的坐标都按 190 跑道算
    const sw = ZOOM ? 2 * 190 / B : 2;              // 边框要跟边格的 2px 对齐，不能跟着放大
    cg.appendChild(el("rect", { x:-RT, y:-RT, width:RB, height:RB, fill:"#A8CCE9", stroke:"#1a1a1a", "stroke-width":sw }));
    if (side === "corner-br") {
      // 赤道（起点）：样式照原图 —— 气泡字+右上黄五角星+深蓝字+宽蓝箭头（尖朝左）内嵌「起点」黄字
      cg.appendChild(idTag(RT-9, RT-7, id));
      cg.appendChild(bubble(0, -46, "赤道", 46, {}));
      cg.appendChild(txt(68, -66, "★", 34, { weight:"bold", fill:"#ffd400", stroke:"#e07800", sw:2 }));
      cg.appendChild(txt(0, 2, "起点/由此去得酬金$2000", 12, { weight:"bold", fill:"#1b3f7e" }));
      // 宽箭头：尖头朝左（指向行进方向），尾部矩形
      cg.appendChild(el("polygon", {
        points:"-70,40 -30,16 56,16 56,64 -30,64",
        fill:"#2e6fd4", stroke:"#eef3fb", "stroke-width":3.5, "stroke-linejoin":"round"
      }));
      cg.appendChild(bubble(-26, 41, "起点", 27, { fill:"#ffd400", dark:"#c8341f" }));
    } else {
      // 地中海 / 北极 / 夏威夷：文字、图案都「头顶朝圆心」
      // 地中海(左下) 45°｜北极(左上) 135°｜夏威夷(右上) -135°
      const rot = side === "corner-bl" ? 45 : (side === "corner-tl" ? 135 : -135);
      const gg = el("g", { transform:`rotate(${rot})` });
      gg.appendChild(bubble(0, LC.textY ?? -16, name, LC.textSize ?? 46, {}));  // 文字往圆心侧让一点，给朝外的图案留空间
      cg.appendChild(gg);
      cg.appendChild(cornerIcon(side, rot));
      const ci = LC.idInset ?? 9;
      cg.appendChild(idTag(RT-ci, RT-ci-2, id));
    }
    if (cg !== g) g.appendChild(cg);
  } else {
    g.appendChild(el("rect", { x:-TW, y:-TH, width:W, height:B, fill:"#ffffff", stroke:"#1a1a1a", "stroke-width":2 }));
    if (ZOOM) {
      // 格子按打印版整格旋转，内容包一层反向旋转转回正立 —— 文字永远头朝上，
      // 底/顶边竖排（长轴在屏幕 y）、左右边横排（长轴在屏幕 x），色带贴圆心一侧
      const inner = el("g", { transform:`rotate(${-(ROTV[side] || 0)})` });
      g.appendChild(inner);
      const box = zoomContentBox(side);
      const vert = side === "top" || side === "bottom";
      if (type === "chance" || type === "destiny") {
        const m = DECKS[type === "chance" ? "chance" : "fate"];
        inner.appendChild(el("rect", { ...zoomBandRect(side), fill: m.bg }));
        zoomFlow(inner, [
          { text: m.sym, k: 1.5, w: 0.9, opts: { weight: "bold", fill: m.ink, opacity: 0.8 } },
          { text: name, k: 1, w: 1.0, opts: { weight: "bold", fill: "#111" } }
        ], box, vert);
      } else if (type === "ocean") {
        inner.appendChild(el("rect", { ...zoomBandRect(side), fill: "#9BB6C4" }));
        zoomFlow(inner, [{ text: name, k: 1, w: 1.0, opts: { weight: "bold", fill: "#2e56b0" } }], box, vert);
      } else {
        inner.appendChild(el("rect", { ...zoomBandRect(side), fill: HEX[colorId] || "#cccccc" }));
        zoomFlow(inner, zoomRows(name, t.flag, price, capital), box, vert);
      }
      // 编号放色带那一端的角落（内容系里四边的「圆心侧」方向不同）
      const idPos = side === "left" ? [TH - 4, TW - 4]
        : (side === "right" ? [-TH + BAND - 4, TW - 4] : [TW - 4, TH - 4]);
      inner.appendChild(idTag(idPos[0], idPos[1], id));
    } else {
      if (type === "chance") deckContent(g, id, name, nameEn, "chance");
      else if (type === "destiny") deckContent(g, id, name, nameEn, "fate");
      else if (type === "ocean") oceanContent(g, id, name);
      else propertyContent(g, id, name, nameEn, t.flag, capital, price, colorId);
    }
  }
  ROOT.appendChild(g);
});

  // 外边框
  ROOT.appendChild(el("rect", {
    x:1, y:1, width:L-2, height:L-2, rx:2,
    fill:"none", stroke:"#222", "stroke-width":4
  }));

  console.log("[map-svg] 打印版棋盘渲染完成，共 " + (DATA.tiles || []).length + " 格");
}

// ===== 打印尺寸（打印版用）=====
// 成品边长取自 JSON 的 board.printMM（80cm 软垫 = 800）：@page 纸张跟着它变。
// 只注入一次，切换布局反复渲染也不会堆积 <style>。
function applyPrintSize(printMM) {
  const mm = printMM || 800, cm = +(mm / 10).toFixed(1).replace(/\.0$/, "");
  let st = document.getElementById("print-size-style");
  if (!st) {
    st = document.createElement("style");
    st.id = "print-size-style";
    document.head.appendChild(st);
  }
  st.textContent = `@page { size: ${mm}mm ${mm}mm; margin: 0; }`;
  document.title = `大富翁 世界之旅 · ${cm}cm 软垫打印版`;
  return cm;
}

function render(vg, DATA, opts) {
  // ROOT：打印版整块棋盘画进 viewport-group 里的这个 <g>
  ROOT = svgEl("g", {});
  vg.appendChild(ROOT);
  applyPrintSize(DATA.board && DATA.board.printMM);
  renderBoard(DATA, !!(opts && opts.zoom));
};

  return { render };
})();

// ===== 渲染地图 =====
function renderMap(data) {
  mapData = data;
  DATA = data;
  loadPalette(data);
  const svg = document.getElementById("map");
  const bs = boardSize();
  svg.setAttribute("viewBox", `0 0 ${bs.w} ${bs.h}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

  const vg = document.getElementById("viewport-group");
  vg.innerHTML = "";
  drawBoard(vg, data);
  renderLegend(data);

  updateModeUI();
  applyFilter();

  if (!hashApplied && location.hash.startsWith("#f=")) {
    hashApplied = true;
    const k = decodeURIComponent(location.hash.slice(3));
    const chip = document.querySelector('.legend-item[data-filter="' + k + '"]');
    if (chip) chip.click();
  }
}

// 整块棋盘：背景 + 中空 + 64 格，按当前布局走两种画法
function drawBoard(vg, data) {
  const bs = boardSize();

  // 打印版 / 放大版：整块交给 PrintBoard（它自己画背景、中心、跑道、卡堆）
  if (isPrintMode()) { PrintBoard.render(vg, data, { zoom: isPrintZoom() }); return; }

  // 渐变定义：中空那块用的底色
  const defs = svgEl("defs", {});
  const grad = svgEl("linearGradient", { id: "centerGrad", x1: "0%", y1: "0%", x2: "100%", y2: "100%" });
  grad.appendChild(svgEl("stop", { offset: "0%", "stop-color": "#fdfcfa" }));
  grad.appendChild(svgEl("stop", { offset: "100%", "stop-color": "#f6f4f0" }));
  defs.appendChild(grad);
  vg.appendChild(defs);

  vg.appendChild(svgEl("rect", { x: 0, y: 0, width: bs.w, height: bs.h, fill: "#f4f2ee", rx: 4 }));

  // 中空：加厚环是 (17-2*RING_T)² 的方块
  const hole = drawThickCenter(vg);
  const cx = hole.x + hole.w / 2, cy = hole.y + hole.h / 2;
  if (hole.h > 90) {
    vg.appendChild(svgText(cx, cy - 6, "世界之旅", Math.min(22, hole.h * 0.13),
      { weight: "bold", color: "#2c2c2a", letterSpacing: "4" }));
    vg.appendChild(svgText(cx, cy + 12, "WORLD TOUR", Math.min(11, hole.h * 0.065),
      { color: "#8a8880", letterSpacing: "2" }));
  }

  data.tiles.forEach(t => {
    const r = tileRectUnit(t.id);
    const W = r.w * U, H = r.h * U;
    const g = tileGroup(t, r.x * U, r.y * U);
    drawThickTile(g, t, W, H);
    vg.appendChild(g);
  });
}

function drawThickCenter(vg) {
  const hs = holeSize(), hx = RING_T * U;
  if (hs > 4) {
    vg.appendChild(svgEl("rect", {
      x: hx, y: hx, width: hs, height: hs,
      fill: "url(#centerGrad)", stroke: "#e8e5df", "stroke-width": 1, rx: 2
    }));
  }
  return { x: hx, y: hx, w: hs, h: hs };
}

// ===== 加厚环的一格：文字在「竖排/横排两行/横排一行」里自动挑字号最大的 =====
function drawThickTile(g, t, W, H) {
  let bg = "#fff", stroke = "#e5e1da", sw = 1;
  if (t.type === "corner") { bg = "#f7f5f1"; stroke = "#b3afa6"; sw = 2; }
  else if (t.type === "chance") { bg = "#fdf7fa"; stroke = "#B06F88"; }
  else if (t.type === "destiny") { bg = "#fdf9f2"; stroke = "#D9BA8E"; }
  else if (t.type === "ocean") { bg = "#f4f8fa"; stroke = "#9BB6C4"; }
  g.appendChild(svgEl("rect", { x: 0, y: 0, width: W, height: H, fill: bg, stroke: stroke, "stroke-width": sw, rx: 2 }));

  // 每格独立裁剪：窄格子里的文字不许溢出压到邻格
  const cpId = "clip-tile-" + t.id;
  const cp = svgEl("clipPath", { id: cpId });
  cp.appendChild(svgEl("rect", { x: 0, y: 0, width: W, height: H }));
  g.appendChild(cp);
  const inner = svgEl("g", { "clip-path": `url(#${cpId})` });
  g.appendChild(inner);

  // 色带贴在格子靠外的一边
  const bandColor = tileColor(t);
  const bt = Math.max(2, Math.min(W, H) * 0.15);
  const edge = tileEdge(t.id);
  let bx = 0, by = 0, bw = W, bh = H;
  if (edge === "bottom") { by = H - bt; bh = bt; }
  else if (edge === "top") { bh = bt; }
  else if (edge === "left") { bw = bt; }
  else { bx = W - bt; bw = bt; }
  inner.appendChild(svgEl("rect", { x: bx, y: by, width: bw, height: bh, fill: bandColor, rx: 1 }));

  if (t.type === "corner") {
    const f = Math.min(W * 0.34, H * 0.26, 15);
    inner.appendChild(svgText(W / 2, H * 0.34, t.name, f, { weight: "bold", color: "#2c2c2a" }));
    inner.appendChild(svgText(W / 2, H * 0.50, t.nameEn, Math.max(6, f * 0.40), { color: "#8a8880", letterSpacing: "1" }));
    const m = String(t.sub || "").match(/\$[\d,]+/);
    if (m) inner.appendChild(svgText(W / 2, H * 0.68, "起点 " + m[0], Math.max(6, f * 0.50), { weight: "bold", color: "#96597A" }));
    return;
  }

  const price = t.price ? String(t.price) : "";
  const c = pickText(t.name, price, W, H);
  const nameColor = t.type === "chance" ? "#96597A" : t.type === "destiny" ? "#7A6338" : t.type === "ocean" ? "#4a6b7c" : "#2c2c2a";
  const priceColor = isSpecial(t) ? "#8a8880" : "#96597A";
  const glyph = t.type === "chance" ? "?" : t.type === "destiny" ? "\u2726" : t.type === "ocean" ? "~" : null;

  if (c.m === "v") {
    const fp = price ? (c.stackPrice ? c.f * 0.92 : c.f * 0.85) : 0;
    const nameH = t.name.length * 1.08 * c.f;
    const priceH = price ? (c.stackPrice ? price.length * 1.08 * fp : 1.6 * fp) : 0;
    const fg = glyph ? Math.min(c.f * 0.9, W * 0.62) : 0;
    const glyphH = (glyph && (H * 0.94 - nameH - priceH) > fg * 1.5) ? fg * 1.2 : 0;
    let y = (H - nameH - priceH - glyphH) / 2 + c.f * 0.55;
    if (glyphH) {
      inner.appendChild(svgText(W / 2, y - c.f * 0.55 + fg * 0.6, glyph, fg, { weight: "bold", color: bandColor }));
      y += glyphH;
    }
    for (let k = 0; k < t.name.length; k++) {
      inner.appendChild(svgText(W / 2, y, t.name[k], c.f, { weight: "bold", color: nameColor }));
      y += c.f * 1.08;
    }
    if (price) {
      if (c.stackPrice) {
        y += fp * 0.35;
        for (let k = 0; k < price.length; k++) {
          inner.appendChild(svgText(W / 2, y, price[k], fp, { color: priceColor }));
          y += fp * 1.08;
        }
      } else {
        y += fp * 0.6;
        inner.appendChild(svgText(W / 2, y, price, fp, { color: priceColor }));
      }
    }
  } else if (c.m === "h2") {
    inner.appendChild(svgText(W / 2, H * 0.40, t.name, c.f, { weight: "bold", color: nameColor }));
    if (price) inner.appendChild(svgText(W / 2, H * 0.74, price, c.f * 0.85, { color: priceColor }));
  } else {
    inner.appendChild(svgText(W / 2, H * 0.52, price ? t.name + " " + price : t.name, c.f, { weight: "bold", color: nameColor }));
  }
}

function renderLegend(data) {
  // 渲染图例（分 3 行：国家色组 / 机会命运 / 海洋角落）
  const legend = document.getElementById("legend");
  legend.innerHTML = "";

  // 辅助：创建一个筛选按钮
  function makeChip(c) {
    const item = document.createElement("button");
    item.className = "legend-item" + (c.key === "all" ? " on" : "");
    item.dataset.filter = c.key;
    if (c.color) {
      const sw = document.createElement("span");
      sw.className = "legend-color";
      sw.style.background = c.color;
      item.appendChild(sw);
    }
    item.appendChild(document.createTextNode(`${c.name} (${c.count})`));
    item.addEventListener("click", () => setFilter(c.key, c.name));
    return item;
  }

  // 国家：颜色组多就分两行，“全部”挂在第一行开头
  const groups = data.colorGroups || [];
  const half = Math.ceil(groups.length / 2);
  [groups.slice(0, half), groups.slice(half)].forEach((gs, ri) => {
    const row = document.createElement("div");
    row.className = "legend-row";
    const label = document.createElement("span");
    label.className = "legend-label";
    label.textContent = ri === 0 ? "国家" : "";
    row.appendChild(label);
    if (ri === 0) row.appendChild(makeChip({ key: "all", name: "全部", count: data.tiles.length, color: null }));
    gs.forEach(g => {
      row.appendChild(makeChip({
        key: "color:" + g.key, name: g.name, count: countOf(x => x.colorId === g.id),
        color: HEX[g.id] || HEXBYKEY[g.key] || "#ccc"
      }));
    });
    legend.appendChild(row);
  });

  // 特殊格：按 tileTypes 里定义的类型自动生成，两两一行（机会/命运 · 海洋/角落）
  const types = Object.keys(data.tileTypes || {}).filter(k => k !== "property");
  for (let i = 0; i < types.length; i += 2) {
    const pair = types.slice(i, i + 2);
    const row = document.createElement("div");
    row.className = "legend-row";
    const label = document.createElement("span");
    label.className = "legend-label";
    label.textContent = pair.map(k => data.tileTypes[k].name).join("/");
    row.appendChild(label);
    pair.forEach(k => {
      const n = countOf(x => x.type === k);
      if (n) row.appendChild(makeChip({
        key: "special:" + k, name: data.tileTypes[k].name, count: n, color: specialColor(k)
      }));
    });
    legend.appendChild(row);
  }

  // 初始化 viewport（事件只绑一次，避免切换布局时重复叠加）
}

// ===== 工具栏：布局切换 + 导出 PNG =====
function initToolbar() {
  // 布局切换：加厚环 / 打印版 / 放大版（三选一，点哪个切哪个）
  document.querySelectorAll("#seg-layout .seg-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      if (!mapData || btn.dataset.mode === layoutMode) return;
      layoutMode = btn.dataset.mode;
      renderMap(mapData);
    });
  });

  // 打印：先切到打印版（@page 尺寸随之注入），再开打印对话框
  document.getElementById("btn-print").addEventListener("click", () => {
    if (!mapData) return;
    if (layoutMode !== "print") {
      layoutMode = "print";
      renderMap(mapData);
    }
    setTimeout(() => window.print(), 120);   // 等重画完再弹对话框
  });

  document.getElementById("btn-png").addEventListener("click", exportPNG);
}

// 导出时长边约 2400px（加厚环 340 → ×6；打印版 1800 → ×2），上限 6 倍
function exportScale(bs) { return Math.min(6, Math.max(1, Math.ceil(2400 / Math.max(bs.w, bs.h)))); }

function exportFileName() {
  const tag = isPrintZoom() ? "放大版" : (isPrintMode() ? "打印版" : "加厚环");
  const filter = currentFilter === "all" ? "" : "-筛选";
  return `大富翁世界之旅地图-${tag}${filter}.png`;
}

function exportPNG() {
  const btn = document.getElementById("btn-png");
  const restore = () => {
    btn.classList.remove("busy");
    updateModeUI();                       // 文案按当前档位还原（打印版/放大版有后缀）
  };

  // 复制一份 SVG 用于导出：去掉当前的缩放/平移，按 1:1 导出整块板
  const clone = document.getElementById("map").cloneNode(true);
  const cvg = clone.querySelector("#viewport-group");
  if (cvg) cvg.removeAttribute("transform");
  clone.setAttribute("xmlns", SVG_NS);
  clone.setAttribute("xmlns:xlink", "http://www.w3.org/1999/xlink");

  const bs = boardSize();
  const vb = (clone.getAttribute("viewBox") || `0 0 ${bs.w} ${bs.h}`).split(/[\s,]+/).map(Number);
  const vw = vb[2] || bs.w, vh = vb[3] || bs.h;
  clone.setAttribute("width", vw);
  clone.setAttribute("height", vh);

  const xml = new XMLSerializer().serializeToString(clone);
  const svgBlob = new Blob(["<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n" + xml],
    { type: "image/svg+xml;charset=utf-8" });
  const svgUrl = URL.createObjectURL(svgBlob);

  btn.classList.add("busy");
  btn.textContent = "导出中…";

  const img = new Image();
  img.onload = function () {
    try {
      const scale = exportScale({ w: vw, h: vh });
      const cv = document.createElement("canvas");
      cv.width = Math.round(vw * scale);
      cv.height = Math.round(vh * scale);
      const ctx = cv.getContext("2d");
      ctx.fillStyle = "#f4f2ee";
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(svgUrl);

      const save = function (href, revoke) {
        const a = document.createElement("a");
        a.href = href;
        a.download = exportFileName();
        document.body.appendChild(a);
        a.click();
        a.remove();
        if (revoke) setTimeout(() => URL.revokeObjectURL(href), 4000);
        restore();
      };
      if (cv.toBlob) cv.toBlob(b => save(URL.createObjectURL(b), true), "image/png");
      else save(cv.toDataURL("image/png"), false);
    } catch (e) {
      URL.revokeObjectURL(svgUrl);
      restore();
      alert("导出失败：" + e.message + "\n可以试试用浏览器的「打印 → 另存为 PDF」。");
    }
  };
  img.onerror = function () {
    URL.revokeObjectURL(svgUrl);
    restore();
    alert("导出失败：浏览器无法渲染这张 SVG。\n可以试试用浏览器的「打印 → 另存为 PDF」。");
  };
  img.src = svgUrl;
}

initToolbar();   // 按钮是静态元素，先绑好，不等地图渲染

// ===== 加载数据：优先 fetch JSON，失败则用本地兜底 =====
fetch("./content/map-print-data.json")
  .then(res => {
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  })
  .then(data => {
    console.log("[map-svg] 数据来源: map-print-data.json（打印版）");
    renderMap(data);
  })
  .catch(err => {
    console.warn("[map-svg] fetch map-print-data.json 失败，使用内置兜底数据:", err.message);
    renderMap(FALLBACK_DATA);
  });
</script>
