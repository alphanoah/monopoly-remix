<style>
  /* ===== 成品：80×80cm 软垫（2mm 厚 / 3mm 精装锁边），无边距 ===== */
  @page {
    size: 800mm 800mm;
    margin: 0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    background: #fff;
    color: #222;
  }
  .page { margin: 0 auto; }
  svg { display: block; width: 100%; height: 100%; }

  /* 打印时：整页 800×800mm，棋盘铺满 */
  @media print {
    .page {
      width: 800mm !important;
      height: 800mm !important;
      margin: 0 !important;
    }
  }

  /* 屏幕上的提示条，打印时隐藏 */
  .screen-hint {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    background: #2c2c2a; color: #fff; padding: 8px 16px; border-radius: 999px;
    font-size: 13px; z-index: 99; box-shadow: 0 4px 16px rgba(0,0,0,.2);
  }
  .screen-hint button {
    background: #fff; color: #2c2c2a; border: 0; border-radius: 999px;
    padding: 4px 12px; margin-left: 8px; cursor: pointer; font-weight: 600;
  }
  @media print {
    .screen-hint { display: none; }
    body { background: #fff; }
  }
</style>

// ===== 输出模式 =====
// ?export=png → 棋盘铺满窗口，供高清截图导出
const PARAMS = new URLSearchParams(location.search);
const EXPORT_PNG = PARAMS.get("export") === "png";
if (EXPORT_PNG) {
  document.querySelector(".screen-hint").style.display = "none";
}

// ===== 布局参数（原版：跑道宽=角格边长，格子紧挨无间距；这里跑道加宽、格子更长）=====
const L = 1800;             // 棋盘边长
const B = 170;              // 跑道宽（角格边长、横向格高、纵向格宽）
const W = (L - 2*B) / 15;   // 格宽（横向格宽、纵向格高）≈ 97.33
const TW = W / 2;           // 半格宽
const TH = B / 2;           // 半格高（也是角格半边长）
const BAND = 38;            // 色带宽（靠圆心一侧）

const svg = document.getElementById("board");
const NS = "http://www.w3.org/2000/svg";

function el(tag, attrs, children) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (children) children.forEach(c => e.appendChild(c));
  return e;
}
function txt(x, y, str, size, opts = {}) {
  const t = el("text", {
    x, y, "font-size": size,
    "text-anchor": opts.anchor || "middle",
    "dominant-baseline": opts.baseline || "middle",
    "font-weight": opts.weight || "normal",
    fill: opts.fill || "#222",
    "font-family": opts.family || '"PingFang SC","Microsoft YaHei",sans-serif',
    "paint-order": "stroke",
    "stroke-linejoin": "round"
  });
  if (opts.ls) t.setAttribute("letter-spacing", opts.ls);
  if (opts.opacity != null) t.setAttribute("opacity", opts.opacity);
  if (opts.stroke) { t.setAttribute("stroke", opts.stroke); t.setAttribute("stroke-width", opts.sw || 3); }
  t.textContent = str;
  return t;
}
// 气泡字：白色外晕 + 深色描边 + 彩色填充（角格「赤道/地中海/北极/夏威夷」「起点」「大富翁」用）
function bubble(x, y, str, size, opts = {}) {
  const g = el("g");
  const mk = (sc, sw, fill) => txt(x, y, str, size, { weight:"bold", fill, stroke:sc, sw, ...opts });
  g.appendChild(mk("#ffffff", size * 0.38, "#ffffff"));
  g.appendChild(mk(opts.dark || "#1b3f7e", size * 0.16, opts.dark || "#1b3f7e"));
  g.appendChild(mk(opts.dark || "#1b3f7e", size * 0.02, opts.fill || "#2e8fd4"));
  return g;
}
// 格子编号（来自 map-data.json 的 id）
function idTag(x, y, id, onDark) {
  return txt(x, y, "#" + id, 12, {
    weight: "bold",
    fill: onDark ? "#ffffff" : "#5a6a80",
    stroke: onDark ? "rgba(0,0,0,.35)" : "#ffffff",
    sw: onDark ? 2.5 : 2
  });
}

// ===== 背景 =====

// ===== 中心区（深蓝底 + 大富翁 + 两张卡堆）=====

svg.appendChild(el("polygon", { points:`1020,170 1180,170 1090,900 840,900`, fill:"#ffffff", opacity:0.05 }));

// —— 卡牌背面样式的两个卡堆（样式完全照 print.html 卡牌背面）——
function cardBack(x, y, w, h, kind, rot) {
  const m = DECK[kind];
  const g = el("g", { transform:`translate(${x},${y}) rotate(${rot})` });
  // 下面垫两张，做出「牌堆」的厚度感
  [[16, 14], [8, 7]].forEach(([ox, oy], i) => {
    g.appendChild(el("rect", { x:-w/2+ox, y:-h/2+oy, width:w, height:h, rx:10,
      fill:m.bg, stroke:"rgba(0,0,0,.22)", "stroke-width":2, opacity: i ? 0.75 : 0.55 }));
  });
  // 卡面
  g.appendChild(el("rect", { x:-w/2, y:-h/2, width:w, height:h, rx:10, fill:m.bg, stroke:"rgba(0,0,0,.22)", "stroke-width":2 }));
  // 尺寸基准 = 短边（横版也能保持和竖版一致的视觉比例）
  const u = Math.min(w, h);
  // 内框（inset 3mm ≈ 短边的 4.8%）
  const ins = u * 0.048;
  g.appendChild(el("rect", { x:-w/2+ins, y:-h/2+ins, width:w-2*ins, height:h-2*ins, rx:6,
    fill:"none", stroke:m.fg, "stroke-width":3, opacity:0.72 }));
  // 面：字 + 大号符号 + 字
  const fs = u * 0.185, ss = u * 0.30, gap = u * 0.075;
  const total = fs + gap + ss + gap + fs, x0 = -total/2;
  g.appendChild(txt(x0 + fs/2, -h*0.05, m.w1, fs, { weight:"bold", fill:m.fg }));
  g.appendChild(txt(x0 + fs + gap + ss/2, -h*0.05, m.sym, ss, { weight:"bold", fill:m.fg, opacity:0.5 }));
  g.appendChild(txt(x0 + fs + gap + ss + gap + fs/2, -h*0.05, m.w2, fs, { weight:"bold", fill:m.fg }));
  // 英文行（70% 处）
  g.appendChild(txt(0, h*0.22, m.en, u*0.055, { weight:"bold", fill:m.fg, ls:u*0.024, opacity:0.72 }));
  // 左上角「大富翁」椭圆印章（rotate -12°）
  const st = el("g", { transform:`translate(${-w/2 + u*0.16},${-h/2 + u*0.13}) rotate(-12)` });
  st.appendChild(el("ellipse", { cx:0, cy:0, rx:u*0.115, ry:u*0.076, fill:"none",
    stroke:m.fg, "stroke-width":2.5, "stroke-dasharray":"6 5", opacity:0.88 }));
  st.appendChild(txt(0, 1, "大富翁", u*0.048, { weight:"bold", fill:m.fg }));
  g.appendChild(st);
  // 右下角小恶魔标（同 print.html 背面）
  const s = u * 0.10 / 40;
  const dv = el("g", { transform:`translate(${w/2 - u*0.115},${h/2 - u*0.075}) scale(${s}) translate(-20,-18)` });
  dv.appendChild(el("path", { d:"M8 8 Q6 2 11 0 Q10 6 14 8 Z", fill:m.fg }));
  dv.appendChild(el("path", { d:"M32 8 Q34 2 29 0 Q30 6 26 8 Z", fill:m.fg }));
  dv.appendChild(el("path", { d:"M20 6 C11 6 5 12 5 19 C5 26 11 30 20 30 C29 30 35 26 35 19 C35 12 29 6 20 6 Z", fill:m.fg }));
  ["M12 17 Q15 14 18 17","M22 17 Q25 14 28 17","M13 21 Q20 27 27 21"].forEach(d => {
    dv.appendChild(el("path", { d, fill:"none", stroke:m.fg, "stroke-width":1.5, "stroke-linecap":"round" }));
  });
  g.appendChild(dv);
  return g;
}
// 横版卡：宽 > 高（与实物牌堆平放的朝向一致）
svg.appendChild(cardBack(465, 500, 430, 296, "fate", -14));     // 命运牌堆（左上）
svg.appendChild(cardBack(1335, 1305, 430, 296, "chance", -14)); // 机会牌堆（右下）

// ===== 跑道格子 =====
// 四边同一套设计：色带在靠圆心一侧，内容依次 编号→国名→英文→国旗→$价格→首都，
// 整格旋转：底 0° / 左 +90° / 顶 180° / 右 -90°（与原版照片一致）
function tileGroup(col, row, side) {
  let cx, cy, rot;
  if (side === "top")         { cx = B + (col-1)*W + W/2; cy = B/2;              rot = 180; }
  else if (side === "bottom") { cx = B + (col-1)*W + W/2; cy = L - B/2;           rot = 0;   }
  else if (side === "left")   { cx = B/2;                 cy = B + (row-1)*W + W/2; rot = 90; }
  else if (side === "right")  { cx = L - B/2;             cy = B + (row-1)*W + W/2; rot = -90; }
  else if (col===0 && row===0)   { cx = B/2;   cy = B/2;   rot = 0; }
  else if (col===16 && row===0)  { cx = L-B/2; cy = B/2;   rot = 0; }
  else if (col===0 && row===16)  { cx = B/2;   cy = L-B/2; rot = 0; }
  else                           { cx = L-B/2; cy = L-B/2; rot = 0; }  // 赤道
  return el("g", { transform:`translate(${cx},${cy}) rotate(${rot})` });
}
// 局部坐标：x∈[-TW,TW]，y∈[-TH,TH]，色带在 y=-TH 一端（即靠圆心一侧）
function propertyContent(g, id, name, nameEn, capital, price, color) {
  g.appendChild(el("rect", { x:-TW, y:-TH, width:W, height:BAND, fill:COLORS[color] }));
  g.appendChild(idTag(0, -TH + BAND/2, id, true));
  if (name.length >= 6) {  // 国名过长（≥6 字）自动拆两行
    g.appendChild(txt(0, -44, name.slice(0, 4), 13, { weight:"bold", fill:"#111" }));
    g.appendChild(txt(0, -28, name.slice(4), 13, { weight:"bold", fill:"#111" }));
    g.appendChild(txt(0, -12, nameEn, 8.5, { fill:"#444", family:'Georgia,"Times New Roman",serif' }));
  } else {
    const fs = name.length >= 5 ? 13 : (name.length === 4 ? 16 : 19);
    g.appendChild(txt(0, -30, name, fs, { weight:"bold", fill:"#111" }));
    g.appendChild(txt(0, -12, nameEn, 8.5, { fill:"#444", family:'Georgia,"Times New Roman",serif' }));
  }
  g.appendChild(txt(0, 24, FLAGS[name] || "🏳️", 28, {}));
  g.appendChild(txt(0, 54, "$" + price, 18, { weight:"bold", fill:"#1a55a5" }));
  g.appendChild(txt(0, 74, capital, 12, { fill:"#222" }));
}
// 机会 / 命运格：符号与 print.html 卡牌背面一致（？ / ！）
function deckContent(g, id, name, nameEn, kind) {
  const m = DECK[kind];
  g.appendChild(idTag(0, -74, id, false));
  g.appendChild(txt(0, -48, name, 24, { weight:"bold", fill:"#111" }));
  g.appendChild(txt(0, -31, nameEn, 11, { weight:"bold", fill:m.ink, ls:2 }));
  g.appendChild(txt(0, 14, m.sym, 66, { weight:"bold", fill:m.ink, opacity:0.7 }));
  g.appendChild(txt(0, 58, "抽取", 11, { fill:"#222" }));
  g.appendChild(txt(0, 72, nameEn === "CHANCE" ? "机会一张" : "命运一张", 11, { fill:"#222" }));
}
function oceanContent(g, id, name) {
  g.appendChild(idTag(0, -76, id, false));
  const blues = ["#6a8ad8", "#4a72c8", "#2e56b0"];
  const chars = name.split("");
  chars.forEach((c, i) => {
    const y = (i - (chars.length-1)/2) * 46;
    g.appendChild(el("circle", { cx:0, cy:y, r:20, fill:blues[i % 3] }));
    g.appendChild(txt(0, y+1, c, 22, { weight:"bold", fill:"#fff" }));
  });
}
// 角格图案（画在朝外那个角；朝向与文字一致 —— 图案「头顶」也朝圆心）
function cornerIcon(side, rot) {
  // 朝外的角：地中海(左下) -37,+37｜北极(左上) -37,-37｜夏威夷(右上) +37,-37
  const pos = side === "corner-tr" ? [37, -37] : (side === "corner-tl" ? [-37, -37] : [-37, 37]);
  const g = el("g", { transform:`translate(${pos[0]},${pos[1]}) rotate(${rot}) scale(0.85)` });
  if (side === "corner-bl") {           // 地中海：帆船
    g.appendChild(el("path", { d:"M-15,18 Q2,28 20,18 L15,10 L-9,10 Z", fill:"#2a4a8a" }));
    g.appendChild(el("polygon", { points:"1,-26 1,6 -14,6", fill:"#ffffff", stroke:"#8a9ab5", "stroke-width":1.5 }));
    g.appendChild(el("polygon", { points:"7,-22 7,6 23,6", fill:"#ffffff", stroke:"#8a9ab5", "stroke-width":1.5 }));
    g.appendChild(el("line", { x1:7, y1:-14, x2:7, y2:6, stroke:"#d42a2a", "stroke-width":4 }));
  } else if (side === "corner-tl") {    // 北极：冰屋
    g.appendChild(el("path", { d:"M-22,18 A22,22 0 0 1 22,18 Z", fill:"#f2f4f6", stroke:"#9ab0c4", "stroke-width":2 }));
    g.appendChild(el("path", { d:"M-7,18 A7,9 0 0 1 7,18 Z", fill:"#5a6a8a" }));
    g.appendChild(el("path", { d:"M-16,6 Q0,-2 16,6 M-12,-7 Q0,-14 12,-7", fill:"none", stroke:"#b8c4d0", "stroke-width":2 }));
  } else {                              // 夏威夷：棕榈
    g.appendChild(el("ellipse", { cx:0, cy:28, rx:24, ry:5, fill:"#f0e0b8" }));
    g.appendChild(el("path", { d:"M-5,28 Q-1,6 10,-8", fill:"none", stroke:"#8a5a2a", "stroke-width":5, "stroke-linecap":"round" }));
    [-55,-25,5,35,65].forEach(a => {
      g.appendChild(el("ellipse", { cx:10, cy:-8, rx:15, ry:5, fill:"#3aa54a",
        transform:`rotate(${a} 10 -8) translate(0,-9)` }));
    });
  }
  return g;
}

TILES.forEach(t => {
  const [id, col, row, side, type, name, nameEn, sub, price, color] = t;
  const g = tileGroup(col, row, side);

  if (type === "corner") {
    g.appendChild(el("rect", { x:-TH, y:-TH, width:B, height:B, fill:"#A8CCE9", stroke:"#1a1a1a", "stroke-width":2 }));
    if (side === "corner-br") {
      // 赤道（起点）：编号 + 气泡字横排 + 黄星 + 红字 + 蓝色起点箭头（无小人）
      g.appendChild(idTag(0, -70, id, false));
      g.appendChild(bubble(0, -38, "赤道", 44, {}));
      g.appendChild(txt(60, -46, "✦", 32, { weight:"bold", fill:"#ffd400", stroke:"#e07800", sw:2 }));
      g.appendChild(txt(0, -2, "起点/由此去得酬金$2000", 11.5, { weight:"bold", fill:"#d42a2a" }));
      g.appendChild(el("polygon", {
        points:"-72,34 -20,10 44,10 44,58 -20,58",
        fill:"#2e6fd4", stroke:"#eef3fb", "stroke-width":3, "stroke-linejoin":"round"
      }));
      g.appendChild(bubble(14, 34, "起点", 26, { fill:"#ffd400", dark:"#d42a2a" }));
    } else {
      // 地中海 / 北极 / 夏威夷：文字朝圆心为正
      // 地中海(左下) 45°｜北极(左上) 135°｜夏威夷(右上) -135°
      const rot = side === "corner-bl" ? 45 : (side === "corner-tl" ? 135 : -135);
      const gg = el("g", { transform:`rotate(${rot})` });
      gg.appendChild(bubble(0, -14, name, 44, {}));  // 文字往圆心侧让一点，给朝外的图案留空间
      g.appendChild(gg);
      g.appendChild(cornerIcon(side, rot));
      g.appendChild(idTag(side === "corner-bl" ? 50 : (side === "corner-tl" ? 50 : -50),
                          side === "corner-bl" ? -50 : 50, id, false));
    }
  } else {
    g.appendChild(el("rect", { x:-TW, y:-TH, width:W, height:B, fill:"#ffffff", stroke:"#1a1a1a", "stroke-width":2 }));
    if (type === "chance") deckContent(g, id, name, nameEn, "chance");
    else if (type === "destiny") deckContent(g, id, name, nameEn, "fate");
    else if (type === "ocean") oceanContent(g, id, name);
    else propertyContent(g, id, name, nameEn, sub, price, color);
  }
  svg.appendChild(g);
});

// 外边框
svg.appendChild(el("rect", {
  x:1, y:1, width:L-2, height:L-2, rx:2,
  fill:"none", stroke:"#222", "stroke-width":4
}));

console.log("棋盘渲染完成，共 " + TILES.length + " 格");

// 屏幕自适应：正方形棋盘居中；export=png 时铺满 100%
function fitBoard() {
  if (window.matchMedia("print").matches) return;
  const s = Math.min(window.innerWidth, window.innerHeight) * (EXPORT_PNG ? 1 : 0.88);
  const page = document.querySelector(".page");
  page.style.width = s + "px";
  page.style.height = s + "px";
  page.style.marginLeft = "auto";
  page.style.marginRight = "auto";
  page.style.marginTop = ((window.innerHeight - s) / 2) + "px";
}
window.addEventListener("resize", fitBoard);
fitBoard();

</script>
