// ===== SVG 辅助函数 =====
function svgEl(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    el.setAttribute(k, v);
  }
  return el;
}

function svgText(x, y, text, fontSize, opts = {}) {
  const t = svgEl("text", {
    x: x,
    y: y,
    "font-size": fontSize,
    "font-family": opts.fontFamily || "-apple-system, PingFang SC, Microsoft YaHei, sans-serif",
    "font-weight": opts.weight || "normal",
    fill: opts.color || "#333",
    "text-anchor": "middle",
    "dominant-baseline": "middle"
  });
  if (opts.letterSpacing) t.setAttribute("letter-spacing", opts.letterSpacing);
  t.textContent = text;
  return t;
}

// ===== 缩放平移状态 =====
let zoom = 1;
let panX = 0;
let panY = 0;
const MIN_ZOOM = 0.3;
const MAX_ZOOM = 5;

function updateViewport() {
  const g = document.getElementById("viewport-group");
  g.setAttribute("transform", `translate(${panX},${panY}) scale(${zoom})`);
  document.getElementById("zoom-level").textContent = Math.round(zoom * 100) + "%";
}

// ===== 渲染地图 =====
function renderMap(data) {
  const svg = document.getElementById("map");
  svg.setAttribute("viewBox", `0 0 ${SVG_W} ${SVG_H}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

  // 所有内容画到 viewport-group 里
  const vg = document.getElementById("viewport-group");

  // 背景
  vg.appendChild(svgEl("rect", {
    x: 0, y: 0, width: SVG_W, height: SVG_H,
    fill: "#d4e6f1", rx: 4
  }));

  // 中心区域
  const cx = GAP + TILE_W;
  const cy = GAP + TILE_H;
  const cw = 15 * TILE_W + 14 * GAP;
  const ch = 15 * TILE_H + 14 * GAP;

  const centerGrad = svgEl("linearGradient", { id: "centerGrad", x1: "0%", y1: "0%", x2: "100%", y2: "100%" });
  centerGrad.appendChild(svgEl("stop", { offset: "0%", "stop-color": "#eaf2f8" }));
  centerGrad.appendChild(svgEl("stop", { offset: "100%", "stop-color": "#d4e6f1" }));
  svg.insertBefore(centerGrad, vg);

  vg.appendChild(svgEl("rect", {
    x: cx, y: cy, width: cw, height: ch,
    fill: "url(#centerGrad)", stroke: "#aeb6bf", "stroke-width": 1, rx: 2
  }));

  // 中心标题
  vg.appendChild(svgText(cx + cw / 2, cy + ch / 2 - 8, "世界之旅", 24, { weight: "bold", color: "#2c3e50", letterSpacing: "4" }));
  vg.appendChild(svgText(cx + cw / 2, cy + ch / 2 + 16, "WORLD TOUR", 12, { color: "#85929e", letterSpacing: "2" }));

  // 渲染格子
  data.tiles.forEach(t => {
    const x = GAP + t.col * (TILE_W + GAP);
    const y = GAP + t.row * (TILE_H + GAP);
    const g = svgEl("g", { transform: `translate(${x},${y})` });

    if (t.type) {
      let bg = "#fff", stroke = "#ccd5db", sw = 1;
      if (t.type === "corner") { bg = "#d4e6f1"; stroke = "#2980b9"; sw = 2; }
      else if (t.type === "chance") { bg = "#fffde7"; stroke = "#f1c40f"; sw = 1; }
      else if (t.type === "destiny") { bg = "#f5eef8"; stroke = "#a569bd"; sw = 1; }
      else if (t.type === "ocean") { bg = "#e8f6f3"; stroke = "#2ecc71"; sw = 1; }

      g.appendChild(svgEl("rect", { x: 0, y: 0, width: TILE_W, height: TILE_H, fill: bg, stroke: stroke, "stroke-width": sw, rx: 2 }));

      if (t.type === "corner") {
        g.appendChild(svgText(TILE_W / 2, TILE_H / 2 - 6, t.name, 16, { weight: "bold", color: "#1a5276" }));
        g.appendChild(svgText(TILE_W / 2, TILE_H / 2 + 12, t.nameEn, 9, { color: "#5499c7", letterSpacing: "0.5" }));
        if (t.sub) {
          g.appendChild(svgText(TILE_W / 2, TILE_H / 2 + 26, t.sub, 8, { weight: "bold", color: "#d35400" }));
        }
      } else if (t.type === "chance") {
        g.appendChild(svgText(TILE_W / 2, TILE_H / 2 - 14, "?", 28, { weight: "bold", color: "#e74c3c" }));
        g.appendChild(svgText(TILE_W / 2, TILE_H / 2 + 12, t.name, 11, { weight: "bold", color: "#b7950b" }));
        g.appendChild(svgText(TILE_W / 2, TILE_H / 2 + 26, t.nameEn, 7, { color: "#b7950b" }));
      } else if (t.type === "destiny") {
        g.appendChild(svgText(TILE_W / 2, TILE_H / 2 - 14, "\u2726", 24, { weight: "bold", color: "#8e44ad" }));
        g.appendChild(svgText(TILE_W / 2, TILE_H / 2 + 12, t.name, 11, { weight: "bold", color: "#6c3483" }));
        g.appendChild(svgText(TILE_W / 2, TILE_H / 2 + 26, t.nameEn, 7, { color: "#6c3483" }));
      } else if (t.type === "ocean") {
        g.appendChild(svgText(TILE_W / 2, TILE_H / 2 - 14, "~", 22, { color: "#2471a3" }));
        g.appendChild(svgText(TILE_W / 2, TILE_H / 2 + 10, t.name, 11, { weight: "bold", color: "#1a5276" }));
        g.appendChild(svgText(TILE_W / 2, TILE_H / 2 + 26, t.nameEn, 7, { color: "#1a5276" }));
      }
    } else {
      g.appendChild(svgEl("rect", { x: 0, y: 0, width: TILE_W, height: TILE_H, fill: "#fff", stroke: "#ccd5db", "stroke-width": 1, rx: 2 }));

      const bandColor = COLORS[t.color] || "#ccc";
      g.appendChild(svgEl("rect", { x: 0, y: 0, width: TILE_W, height: BAND_H, fill: bandColor, rx: 2 }));
      g.appendChild(svgText(8, BAND_H + 8, "#" + t.id, 6, { color: "#d5dbdb" }));

      const cx2 = TILE_W / 2;
      let cy2 = BAND_H + 20;
      g.appendChild(svgText(cx2, cy2, t.name, 13, { weight: "bold", color: "#1a252f" }));
      cy2 += 16;
      g.appendChild(svgText(cx2, cy2, t.nameEn, 7, { color: "#b0b8bf", letterSpacing: "0.3" }));
      cy2 += 14;
      g.appendChild(svgText(cx2, cy2, "$" + t.price, 12, { weight: "bold", color: "#d35400" }));
      cy2 += 14;
      g.appendChild(svgText(cx2, cy2, t.capital, 8, { color: "#95a5a6" }));
    }

    vg.appendChild(g);
  });

  // 渲染图例
  const legend = document.getElementById("legend");
  data.colorGroups.forEach(g => {
    const item = document.createElement("div");
    item.className = "legend-item";
    const color = document.createElement("div");
    color.className = "legend-color";
    color.style.background = COLORS[g.color] || "#ccc";
    item.appendChild(color);
    item.appendChild(document.createTextNode(`${g.name} (${g.count})`));
    legend.appendChild(item);
  });

  // 初始化 viewport
  updateViewport();
  initPanZoom();
}

// ===== 缩放平移交互 =====
function initPanZoom() {
  const container = document.getElementById("svg-container");
  const svg = document.getElementById("map");

  // 鼠标滚轮缩放
  container.addEventListener("wheel", (e) => {
    e.preventDefault();
    const rect = container.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    const newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom * delta));

    // 以鼠标位置为中心缩放
    const scaleRatio = newZoom / zoom;
    panX = mx - (mx - panX) * scaleRatio;
    panY = my - (my - panY) * scaleRatio;
    zoom = newZoom;

    updateViewport();
  }, { passive: false });

  // 拖拽平移（鼠标）
  let isDragging = false;
  let startX = 0, startY = 0, startPanX = 0, startPanY = 0;

  container.addEventListener("mousedown", (e) => {
    isDragging = true;
    startX = e.clientX;
    startY = e.clientY;
    startPanX = panX;
    startPanY = panY;
    container.classList.add("grabbing");
  });

  document.addEventListener("mousemove", (e) => {
    if (!isDragging) return;
    panX = startPanX + (e.clientX - startX);
    panY = startPanY + (e.clientY - startY);
    updateViewport();
  });

  document.addEventListener("mouseup", () => {
    isDragging = false;
    container.classList.remove("grabbing");
  });

  // 触摸：双指缩放 + 单指拖拽
  let touches = {};
  let pinchDist = 0;
  let pinchZoom = 1;

  container.addEventListener("touchstart", (e) => {
    e.preventDefault();
    for (const t of e.touches) {
      touches[t.identifier] = { x: t.clientX, y: t.clientY };
    }
    if (e.touches.length === 1) {
      isDragging = true;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      startPanX = panX;
      startPanY = panY;
    }
    if (e.touches.length === 2) {
      isDragging = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchDist = Math.hypot(dx, dy);
      pinchZoom = zoom;
    }
  }, { passive: false });

  container.addEventListener("touchmove", (e) => {
    e.preventDefault();
    if (e.touches.length === 1 && isDragging) {
      panX = startPanX + (e.touches[0].clientX - startX);
      panY = startPanY + (e.touches[0].clientY - startY);
      updateViewport();
    }
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      const ratio = dist / pinchDist;
      zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, pinchZoom * ratio));
      updateViewport();
    }
  }, { passive: false });

  container.addEventListener("touchend", (e) => {
    for (const t of e.changedTouches) {
      delete touches[t.identifier];
    }
    if (e.touches.length === 0) {
      isDragging = false;
    }
  });

  // 双击重置
  container.addEventListener("dblclick", () => {
    zoom = 1;
    panX = 0;
    panY = 0;
    updateViewport();
  });

  // 工具栏按钮
  document.getElementById("btn-zoom-in").addEventListener("click", () => {
    zoom = Math.min(MAX_ZOOM, zoom * 1.2);
    updateViewport();
  });

  document.getElementById("btn-zoom-out").addEventListener("click", () => {
    zoom = Math.max(MIN_ZOOM, zoom * 0.8);
    updateViewport();
  });

  document.getElementById("btn-reset").addEventListener("click", () => {
    zoom = 1;
    panX = 0;
    panY = 0;
    updateViewport();
  });
}

// ===== 加载数据：优先 fetch JSON，失败则用本地兜底 =====
fetch("./docs/map-data.json")
  .then(res => {
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  })
  .then(data => {
    console.log("[map-svg] 数据来源: map-data.json");
    renderMap(data);
  })
  .catch(err => {
    console.warn("[map-svg] fetch map-data.json 失败，使用本地兜底数据:", err.message);
    renderMap(FALLBACK_DATA);
  });
