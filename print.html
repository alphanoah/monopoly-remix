<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>大富翁卡牌打印版 · v7</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #1c1c1e; font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }

  .chrome { background: #232327; border-bottom: 1px solid #3a3a40; padding: 14px 20px; color: #e8e8e8; position: sticky; top: 0; z-index: 10; }
  .chrome h1 { font-size: 15px; font-weight: 500; margin: 0 0 4px; }
  .home { font-size: 12px; color: #9a9aa2; text-decoration: none; display: inline-block; margin-bottom: 6px; }
  .home:hover { color: #E8738C; }
  .chrome p { font-size: 12px; color: #9a9aa2; margin: 0 0 12px; line-height: 1.6; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn { background: #32323a; color: #dcdce2; border: 0.5px solid #4a4a52; border-radius: 8px; padding: 7px 13px; font-size: 12.5px; cursor: pointer; font-family: inherit; }
  .btn:hover { border-color: #6a6a72; }
  .btn.on { background: #0F6E56; border-color: #1D9E75; color: #E1F5EE; }
  .btn.print { background: #D94F6E; border-color: #E8738C; color: #fff; }
  .btn.off { opacity: .38; pointer-events: none; }
  .sel { background: #32323a; color: #dcdce2; border: 0.5px solid #4a4a52; border-radius: 8px; padding: 7px 9px; font-size: 12.5px; cursor: pointer; font-family: inherit; }
  .sel:disabled { opacity: .55; cursor: default; }
  .sep { width: 1px; height: 18px; background: #4a4a52; }
  /* 可整组隐藏的按钮组（道具模式下隐藏版本下拉 / 分页 / 表情） */
  .grp { display: flex; gap: 8px; align-items: center; }
  .grp[hidden] { display: none; }
  .specs { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 18px; font-size: 12px; color: #9a9aa2; }
  .specs b { color: #e8e8e8; font-weight: 500; }

  .wrap { padding: 24px 0 60px; }
  .page-tag { margin: 0 auto 6px; font-size: 11.5px; color: #7a7a82; letter-spacing: .3px; }
  .sheet {
    background: #fff; margin: 0 auto 22px;
    padding: var(--my) var(--mx);
    display: flex; flex-wrap: wrap; align-content: flex-start;
    gap: var(--gy) var(--gx);
    page-break-after: always; break-after: page;
    box-shadow: 0 2px 10px rgba(0,0,0,.4);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .sheet:last-child { page-break-after: auto; break-after: auto; }

  .card {
    width: var(--cw); height: var(--ch);
    border-radius: 2.6mm;
    display: flex; flex-direction: column; align-items: center;
    padding: 2mm 3mm 2.5mm;
    position: relative; overflow: hidden;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .card.chance { background: #B06F88; color: #fff; }
  .card.fate { background: #D9BA8E; color: #2C3E6B; }
  /* 道具卡：深蓝底米黄字，与命运牌（米黄底深蓝字）互为翻转，一眼可分 */
  .card.prop { background: #2C3E6B; color: #F3E6C8; }

  /* 大号浅色底纹：作为背景顶到最右边缘，文字直接覆盖其上 */
  /* 不用 transform（打印分页时 transform 会导致错位并逃出 overflow 裁剪），
     改用 inset 定位 + 负 margin 抵消全角符号自带的右侧留白，让字形贴右边缘微出血 */
  .wm {
    position: absolute; top: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: flex-end;
    font-size: var(--wms); line-height: 1; font-weight: 700;
    pointer-events: none; z-index: 0;
  }
  .card.chance .wm { color: #CDA3B4; }
  .card.fate .wm { color: #EEE0C4; }
  .card.prop .wm { color: #42598C; }

  /* 编号：左上角 */
  .num { position: absolute; left: 2mm; top: 1.2mm; font-size: var(--nfs); letter-spacing: .5px; font-weight: 500; z-index: 2; }
  .card.chance .num { color: rgba(40,18,28,.8); }
  .card.fate .num { color: rgba(35,30,25,.75); }
  .card.prop .num { color: rgba(243,230,200,.72); }

  .title {
    flex: none; font-size: var(--tfs); font-weight: 700; line-height: 1.15;
    letter-spacing: .28em; margin-right: -.28em;
    margin-top: .5mm; margin-bottom: 1.5mm;
    position: relative; z-index: 1;
  }

  /* 正文区域：整卡宽度（文字直接覆盖底纹），带内边距，超长自动缩字号 */
  .txt {
    flex: 1; min-height: 0; width: 100%;
    padding: 0 1mm;
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.6mm; text-align: center; overflow: hidden;
  }
  .ev { font-size: var(--evfs); font-weight: 700; line-height: 1.3; }
  .ef { font-size: var(--effs); font-weight: 500; line-height: 1.4; }
  .sub { display: flex; flex-direction: column; align-items: center; gap: 1mm; }
  .cond { font-size: calc(var(--effs) - 0.5px); font-weight: 500; line-height: 1.35; opacity: .88; }
  .cond::before { content: "◆ "; font-size: .8em; }

  /* 带小脸的行：图标与文字保持间距 */
  .line { display: flex; align-items: center; justify-content: center; gap: 1.2mm; max-width: 100%; }
  .line .face { width: 1.05em; height: 1.05em; flex: none; display: block; }
  .out { font-size: var(--effs); font-weight: 600; line-height: 1.38; }
  .out.lose { font-weight: 500; opacity: .9; }

  /* 分层：事件与结果之间的细分隔线（只在「新版」下出现） */
  .cdiv {
    display: block; width: 42%; height: .5mm; margin: .8mm auto 0;
    background: currentColor; opacity: .26; border-radius: .3mm; flex: none;
  }
  /* 金额胶囊：只给左右内边距，避免撑高行盒；字号随父级缩放 */
  .amt {
    display: inline-block; padding: 0 .38em; border-radius: .45em;
    font-size: .94em; font-weight: 600; line-height: inherit; white-space: nowrap;
  }
  .card.chance .amt { background: rgba(255,255,255,.94); color: #9B4F6A; }
  .card.fate .amt { background: #2C3E6B; color: #F3E6C8; }
  .card.prop .amt { background: #F3E6C8; color: #2C3E6B; }
  body.st-new .title { margin-top: -1.4mm; margin-bottom: 1.1mm; }

  /* 道具卡：价格行 + 使用规则卡的编号列表 */
  .pprice { font-size: var(--effs); font-weight: 600; line-height: 1.35; }
  .rules { margin: 0; padding-left: 1.15em; width: 100%; text-align: left; }
  .rules li { font-size: var(--effs); font-weight: 500; line-height: 1.4; }
  .rules li + li { margin-top: 1mm; }

  .blank { background: repeating-linear-gradient(45deg, #fafafa, #fafafa 4px, #f2f2f2 4px, #f2f2f2 8px); border: 1px dashed #ddd; border-radius: 2.6mm; width: var(--cw); height: var(--ch); display: flex; align-items: center; justify-content: center; color: #c4c4c4; font-size: var(--evfs); }

  /* ===== 卡牌背面：子元素全部绝对定位，故不参与 flex 排版 ===== */
  .card.back { display: block; }
  .back-frame {
    position: absolute; inset: 3mm;
    border-radius: 1.6mm;
    border: 0.6mm solid currentColor;
    opacity: .72;
    pointer-events: none;
  }
  .back-face {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    gap: calc(var(--cw) * 0.075);
  }
  .back-face .w { font-size: calc(var(--cw) * 0.185); font-weight: 700; line-height: 1; }
  .back-face .sym { font-size: calc(var(--cw) * 0.30); font-weight: 700; line-height: 1; opacity: .5; }
  .back-en {
    position: absolute; left: 0; right: 0; top: 70%;
    font-size: calc(var(--cw) * 0.055); letter-spacing: .45em; text-indent: .45em;
    text-align: center; opacity: .7;
  }
  .back-stamp {
    position: absolute;
    top: calc(var(--ch) * 0.07);
    left: calc(var(--cw) * 0.04);
    width: calc(var(--cw) * 0.24); height: calc(var(--cw) * 0.16);
    transform: rotate(-12deg);
    opacity: .85;
    pointer-events: none;
  }
  .back-stamp ellipse {
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-dasharray: 6 5; opacity: .88;
  }
  .back-stamp text {
    fill: currentColor; font-weight: 700;
    font-size: calc(var(--cw) * 0.048);
    text-anchor: middle; dominant-baseline: central;
  }
  .back-ver {
    position: absolute; right: 5.5%; bottom: 5.5%;
    font-size: calc(var(--cw) * 0.058); letter-spacing: .18em;
    opacity: .82; pointer-events: none;
    display: flex; align-items: center; gap: calc(var(--cw) * 0.012);
  }
  .devil {
    width: calc(var(--cw) * 0.10); height: auto; flex: none;
    fill: currentColor;
  }

  @media print {
    body { background: #fff; }
    .chrome { display: none !important; }
    .wrap { padding: 0; }
    .page-tag { display: none; }
    .sheet { margin: 0; box-shadow: none; overflow: hidden; }
  }
</style>
<style id="pageStyle">@page { size: A4 portrait; margin: 0; }</style>

// 金额高亮：只处理三位及以上，「+1 级」「3 回合」「20%」「14/15/16」都不动
function amtHtml(s) {
  return String(s).replace(/([+\-\u2212]?\d{3,})/g, '<span class="amt">$1</span>');
}
const A = s => (showAmt ? amtHtml(s) : s);

function cardNode(card, idxInDeck, total) {
  let inner;
  if (card.cond) {
    inner = '<div class="ev">' + A(card.event) + '</div>' +
      (newStyle ? '<i class="cdiv"></i>' : '') +
      '<div class="sub">' +
      '<div class="cond">摇骰 · ' + card.cond + '</div>' +
'<div class="line">' + faceSpan('smile', 'out win') + '<span class="out win">' + A(card.win) + '</span></div>' +
'<div class="line">' + faceSpan('frown', 'out lose') + '<span class="out lose">' + A(card.lose) + '</span></div>' +
      '</div>';
  } else {
    inner = '<div class="ev">' + A(card.event) + '</div>' +
      (newStyle ? '<i class="cdiv"></i>' : '') +
      (card.effect ? '<div class="line">' + faceSpan(card.face || 'smile', 'ef') + '<span class="ef">' + A(card.effect) + '</span></div>' : '');
  }
  const el = document.createElement('div');
  el.className = 'card ' + card.deck;
  el.innerHTML =
    '<div class="wm">' + (card.deck === 'chance' ? '?' : '!') + '</div>' +
    '<div class="num">' + (idxInDeck + 1) + '-' + total + '</div>' +
    '<div class="title">' + DECK_NAME[card.deck] + '</div>' +
    '<div class="txt">' + inner + '</div>';
  return el;
}
function deckList(kind) {
  const list = CARDS.filter(c => c.deck === kind);
  return list.map((c, i) => ({ card: c, i, n: list.length }));
}

// 末页补一张「使用规则」卡，顺便把最后一页的空位填满
function ruleNode() {

    '<div class="wm">✦</div>' +
    '<div class="title">道具规则</div>' +

    '</div>';
  return el;
}

function propList() {
  const items = PROPS.items || [];
  const list = items.map((p, i) => ({ kind: 'prop', p: p, i: i }));
  if ((PROPS.rules || []).length) list.push({ kind: 'rule' });
  return list;
}

function frontNode(x) {
  if (x.kind === 'rule') return ruleNode();
  if (x.kind === 'prop') return propNode(x.p, x.i, (PROPS.items || []).length);
  return cardNode(x.card, x.i, x.n);
}
function backNodeFor(x) {
  return backNode(x.kind === 'card' ? x.card.deck : 'prop');
}

// 背面是否需要按花色分页：只要某一堆（最后一堆除外）的张数不能被每页张数整除，
// 连着排就会在某一页中间切换花色 → 出现混色页 → 翻面镜像会把颜色印到另一个花色的卡上。
// 能整除时（如 6 寸 4 张/页、A4 紧凑 10 张/页，20 张都是整除）连着排本来就是整页同色，无需锁定。
function backNeedsSplit() {
  const per = activeLayout().per;
  const kinds = [...new Set(CARDS.map(c => c.deck))];
  return kinds.slice(0, -1).some(k => CARDS.filter(c => c.deck === k).length % per !== 0);
}
function useSplit() {
  return pageMode === 'split' || (side === 'back' && backNeedsSplit());
}

function render() {
  const L = activeLayout();
  const P = PAPERS[currentPaper];
  const split = useSplit();
  const pages = [];
  if (contentType === 'prop') {
    const list = propList();
    for (let i = 0; i < list.length; i += L.per) pages.push(list.slice(i, i + L.per));
  } else if (split) {
    ['chance', 'fate'].forEach(kind => {
      const list = deckList(kind);
      for (let i = 0; i < list.length; i += L.per) pages.push(list.slice(i, i + L.per));
    });
  } else {
    const flow = deckList('chance').concat(deckList('fate'));
    for (let i = 0; i < flow.length; i += L.per) pages.push(flow.slice(i, i + L.per));
  }

  const wrap = document.getElementById('wrap');
  wrap.innerHTML = '';
  pages.forEach((pageItems, pi) => {
    const tag = document.createElement('div');
    tag.className = 'page-tag';
    tag.style.width = P.w + 'mm';
    const kinds = contentType === 'prop'
      ? '道具'
      : [...new Set(pageItems.map(x => DECK_NAME[x.card.deck]))].join(' + ');
    tag.textContent = '第 ' + (pi + 1) + ' 页 / 共 ' + pages.length + ' 页 · ' + kinds + '牌' +
      (side === 'back' ? ' · 背面（对背打印，先印正面再翻面印本页）' : '');
    wrap.appendChild(tag);

    const sheet = document.createElement('div');
    sheet.className = 'sheet';
    sheet.style.width = P.w + 'mm';
    sheet.style.height = P.h + 'mm';
    sheet.style.setProperty('--cw', L.cw + 'mm');
    sheet.style.setProperty('--ch', L.ch + 'mm');
    sheet.style.setProperty('--gx', L.gx + 'mm');
    sheet.style.setProperty('--gy', L.gy + 'mm');
    sheet.style.setProperty('--mx', L.mx + 'mm');
    sheet.style.setProperty('--my', L.my + 'mm');
    sheet.style.setProperty('--tfs', L.tfs + 'px');
    sheet.style.setProperty('--evfs', L.evfs + 'px');
    sheet.style.setProperty('--effs', L.effs + 'px');
    sheet.style.setProperty('--nfs', L.nfs + 'px');
    sheet.style.setProperty('--wms', L.wms + 'mm');

    pageItems.forEach(x => sheet.appendChild(side === 'back' ? backNodeFor(x) : frontNode(x)));
    for (let k = pageItems.length; k < L.per; k++) {
      const b = document.createElement('div');
      b.className = 'blank';
      b.textContent = '备用';
      sheet.appendChild(b);
    }
    wrap.appendChild(sheet);
  });
  autoFit();
  updateSpecs(pages.length);
}

// 内容超出正文区（纵向或横向）就整体缩字号，保证不贴边、不溢出
function autoFit() {
  document.querySelectorAll('.txt').forEach(txt => {
    const nodes = [...txt.querySelectorAll('.ev, .ef, .cond, .out, .pprice')];
    if (!nodes.length) return;
    const base = nodes.map(n => parseFloat(getComputedStyle(n).fontSize) || 10);
    let k = 0;
    while ((txt.scrollHeight > txt.clientHeight + 1 || txt.scrollWidth > txt.clientWidth + 1) && k < 60) {
      k++;
      nodes.forEach((n, i) => { n.style.fontSize = Math.max(5.2, base[i] - k * 0.3) + 'px'; });
    }
  });
}

function updateSpecs(pageCount) {
  const L = activeLayout();
  const P = PAPERS[currentPaper];
  const rows = L.per / L.cols;
  const isProp = contentType === 'prop';
  const modeText = isProp
    ? '顺序排列（末页附一张使用规则卡）'
    : (side === 'back'
        ? (backNeedsSplit()
            ? '按花色分页（本版式会出混色页，背面自动锁定）'
            : '连着排（本版式每页刚好整除，天然整页同色）')
        : (pageMode === 'flow' ? '连着排（机会接命运，不留空位）' : '按花色分页（每花色独立分页）'));
  const total = isProp ? propList().length : CARDS.length;
  document.getElementById('specs').innerHTML =
    '<span>纸张 <b>' + P.name + '（' + P.w + ' × ' + P.h + ' mm）</b></span>' +
    '<span>卡片尺寸 <b>' + L.cw + ' × ' + L.ch + ' mm</b></span>' +
    '<span>版式 <b>' + L.cols + ' 列 × ' + rows + ' 行 = ' + L.per + ' 张/页</b></span>' +
    '<span>分页 <b>' + modeText + '</b></span>' +
    '<span>共 <b>' + total + ' 张 → ' + pageCount + ' 页</b></span>';
}

function syncPaperUI() {
  const isPhoto = currentPaper === 'photo6';
  const isProp = contentType === 'prop';
  document.getElementById('pageStyle').textContent =
    '@page { size: ' + PAPERS[currentPaper].css + '; margin: 0; }';
  if (isProp) {
    document.getElementById('tip').textContent =
      (side === 'back'
        ? '道具背面：先印正面 → 翻面 → 印背面（页数与格子一一对齐）。'
        : '道具模式：每种道具印 1 张；规则里每种各有 2 张，需要就把这一组再打一遍。')
      + PAPERS[currentPaper].tip;
  } else {
    document.getElementById('tip').textContent = side === 'back'
      ? (backNeedsSplit()
          ? '背面模式：本版式会出混色页，已自动锁定按花色分页（整页同色，翻面不错格）。'
          : '背面模式：本版式每页张数刚好整除 20 张，连着排已是整页同色，任意翻法都不会错格。')
        + '流程 = 先印正面 → 翻面 → 印背面（页数与格子一一对齐）。' + PAPERS[currentPaper].tip
      : PAPERS[currentPaper].tip;
  }
  document.querySelectorAll('.btn[data-layout]').forEach(b => b.classList.toggle('off', isPhoto));
  // 仅当本版式真的会出现混色页时才锁定分页按钮
  document.querySelectorAll('.btn[data-mode]').forEach(b => b.classList.toggle('off', side === 'back' && backNeedsSplit()));
}

// 道具模式下藏掉对道具没意义的开关：版本下拉（道具无版本）、分页方式、表情
function syncKindUI() {
  const isProp = contentType === 'prop';
  document.getElementById('grp-ver').hidden = isProp;
  document.getElementById('grp-mode').hidden = isProp;
  document.getElementById('grp-face').hidden = isProp;
  refreshTitle();
}

function refreshTitle() {
  document.getElementById('pageTitle').textContent = contentType === 'prop'
    ? '大富翁道具打印版 · 横版'
    : '大富翁卡牌打印版 · 横版 · ' + DATA.label + (ALL ? '' : '（内置兜底）');
}

// 四组开关按钮共用一个互斥绑定（.off 的按钮带 pointer-events:none，点了也不会触发）
function bindGroup(sel, apply) {
  const btns = [...document.querySelectorAll(sel)];
  btns.forEach(b => b.addEventListener('click', () => {
    btns.forEach(x => x.classList.toggle('on', x === b));
    apply(b);
  }));
}
bindGroup('.btn[data-style]', b => {
  newStyle = b.dataset.style === 'new';
  document.body.classList.toggle('st-new', newStyle);
  document.body.classList.toggle('st-old', !newStyle);
  render();
});
bindGroup('.btn[data-amt]', b => { showAmt = b.dataset.amt === 'on'; render(); });
bindGroup('.btn[data-kind]', b => {
  contentType = b.dataset.kind;
  syncKindUI();
  syncPaperUI();
  render();
});
bindGroup('.btn[data-paper]', b => { currentPaper = b.dataset.paper; syncPaperUI(); render(); });
bindGroup('.btn[data-layout]', b => { currentLayout = b.dataset.layout; syncPaperUI(); render(); });
bindGroup('.btn[data-mode]', b => { pageMode = b.dataset.mode; render(); });
bindGroup('.btn[data-side]', b => { side = b.dataset.side; syncPaperUI(); render(); });
bindGroup('.btn[data-face]', b => { showFace = b.dataset.face === 'on'; render(); });
document.getElementById('doPrint').addEventListener('click', () => window.print());

// ===== 数据版本：优先线上 data/cards.json，读不到就用内置兜底 =====
let currentId = FALLBACK.version;

function applyVersion(id) {
  const v = ALL ? ALL.versions[id] : null;
  if (!v) return;
  currentId = id;
  DATA = v;
  CARDS = v.cards;
  refreshTitle();
  fillVerSel();
  syncPaperUI();
  render();
}

function fillVerSel() {
  const sel = document.getElementById('verSel');
  if (!ALL) {
    sel.innerHTML = '<option>' + FALLBACK.label + '</option>';
    sel.disabled = true;
    sel.title = '未加载到 data/cards.json（本地直接双击打开时属于正常现象）→ 正在使用内置兜底数据';
    return;
  }
  sel.disabled = false;
  sel.title = '数据来自 data/cards.json（由 content/cards.csv 生成）';
  sel.innerHTML = ALL.order.map(v =>
    '<option value="' + v + '"' + (v === currentId ? ' selected' : '') + '>' +
    ALL.versions[v].label + '</option>').join('');
  sel.onchange = () => { picked = true; applyVersion(sel.value); };
}

// 先用兜底数据立刻渲染一版（不等网络），避免线上白屏；JSON 到货后再换掉
fetch('data/cards.json', { cache: 'no-store' })
  .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
  .then(d => {
    if (!d || !d.versions || !d.order || !d.order.length) throw new Error('cards.json 格式不对');
    ALL = d;
    // 用户已经手动选过版本就别抢他的选择，只刷新下拉；没选过就落到 default
    if (!picked) applyVersion(d.default && d.versions[d.default] ? d.default : d.order[0]);
    else fillVerSel();
  })
  .catch(() => {
    ALL = null;
    fillVerSel();
    refreshTitle();
  });

// 道具数据：同样优先线上 data/props.json，读不到就用内置兜底
fetch('data/props.json', { cache: 'no-store' })
  .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
  .then(d => {
    if (!d || !d.items || !d.items.length) throw new Error('props.json 格式不对');
    PROPS = d;
    if (contentType === 'prop') render();
  })
  .catch(() => { PROPS = PROPS_FALLBACK; });

syncKindUI();
syncPaperUI();
fillVerSel();
render();
</script>
</body>
</html>
