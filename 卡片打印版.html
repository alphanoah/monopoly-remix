<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>大富翁卡牌打印版 · v6</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #1c1c1e; font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }

  .chrome { background: #232327; border-bottom: 1px solid #3a3a40; padding: 14px 20px; color: #e8e8e8; position: sticky; top: 0; z-index: 10; }
  .chrome h1 { font-size: 15px; font-weight: 500; margin: 0 0 4px; }
  .chrome p { font-size: 12px; color: #9a9aa2; margin: 0 0 12px; line-height: 1.6; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn { background: #32323a; color: #dcdce2; border: 0.5px solid #4a4a52; border-radius: 8px; padding: 7px 13px; font-size: 12.5px; cursor: pointer; font-family: inherit; }
  .btn:hover { border-color: #6a6a72; }
  .btn.on { background: #0F6E56; border-color: #1D9E75; color: #E1F5EE; }
  .btn.print { background: #D94F6E; border-color: #E8738C; color: #fff; }
  .btn.off { opacity: .38; pointer-events: none; }
  .sep { width: 1px; height: 18px; background: #4a4a52; }
  .specs { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 18px; font-size: 12px; color: #9a9aa2; }
  .specs b { color: #e8e8e8; font-weight: 500; }

  .wrap { padding: 24px 0 60px; }
  .page-tag { margin: 0 auto 6px; font-size: 11.5px; color: #7a7a82; letter-spacing: .3px; }
  .sheet {
    background: #fff; margin: 0 auto 22px;
    padding: var(--my) var(--mx);
    display: flex; flex-wrap: wrap; align-content: flex-start;
    gap: var(--gy) var(--gx);
    page-break-after: always; break-after: page;
    box-shadow: 0 2px 10px rgba(0,0,0,.4);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .sheet:last-child { page-break-after: auto; break-after: auto; }

  .card {
    width: var(--cw); height: var(--ch);
    border-radius: 2.6mm;
    display: flex; flex-direction: column; align-items: center;
    padding: 2mm 3mm 2.5mm;
    position: relative; overflow: hidden;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .card.chance { background: #B06F88; color: #fff; }
  .card.fate { background: #D9BA8E; color: #2C3E6B; }

  /* 大号浅色底纹：作为背景顶到最右边缘，文字直接覆盖其上 */
  /* 不用 transform（打印分页时 transform 会导致错位并逃出 overflow 裁剪），
     改用 inset 定位 + 负 margin 抵消全角符号自带的右侧留白，让字形贴右边缘微出血 */
  .wm {
    position: absolute; top: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: flex-end;
    font-size: var(--wms); line-height: 1; font-weight: 700;
    pointer-events: none; z-index: 0;
  }
  .card.chance .wm { color: #CDA3B4; }
  .card.fate .wm { color: #EEE0C4; }

  /* 编号：左上角 */
  .num { position: absolute; left: 2mm; top: 1.2mm; font-size: var(--nfs); letter-spacing: .5px; font-weight: 500; z-index: 2; }
  .card.chance .num { color: rgba(40,18,28,.8); }
  .card.fate .num { color: rgba(35,30,25,.75); }

  .title {
    flex: none; font-size: var(--tfs); font-weight: 700; line-height: 1.15;
    letter-spacing: .28em; margin-right: -.28em;
    margin-top: .5mm; margin-bottom: 1.5mm;
    position: relative; z-index: 1;
  }

  /* 正文区域：整卡宽度（文字直接覆盖底纹），带内边距，超长自动缩字号 */
  .txt {
    flex: 1; min-height: 0; width: 100%;
    padding: 0 1mm;
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.6mm; text-align: center; overflow: hidden;
  }
  .ev { font-size: var(--evfs); font-weight: 700; line-height: 1.4; }
  .ef { font-size: var(--effs); font-weight: 500; line-height: 1.4; }
  .sub { display: flex; flex-direction: column; align-items: center; gap: 1mm; }
  .cond { font-size: calc(var(--effs) - 0.5px); font-weight: 500; line-height: 1.35; opacity: .88; }
  .cond::before { content: "◆ "; font-size: .8em; }

  /* 带小脸的行：图标与文字保持间距 */
  .line { display: flex; align-items: center; justify-content: center; gap: 1.2mm; max-width: 100%; }
  .line .face { width: 1.05em; height: 1.05em; flex: none; display: block; }
  .out { font-size: var(--effs); font-weight: 600; line-height: 1.38; }
  .out.lose { font-weight: 500; opacity: .9; }

  .blank { background: repeating-linear-gradient(45deg, #fafafa, #fafafa 4px, #f2f2f2 4px, #f2f2f2 8px); border: 1px dashed #ddd; border-radius: 2.6mm; width: var(--cw); height: var(--ch); display: flex; align-items: center; justify-content: center; color: #c4c4c4; font-size: var(--evfs); }

  /* ===== 卡牌背面 ===== */
  .card.back {
    display: block;
    padding: 3mm;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .back-frame {
    position: absolute; inset: 3mm;
    border-radius: 1.6mm;
    border: 0.6mm solid currentColor;
    opacity: .72;
    pointer-events: none;
  }
  .back-face {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    gap: calc(var(--cw) * 0.075);
  }
  .back-face .w { font-size: calc(var(--cw) * 0.185); font-weight: 700; line-height: 1; }
  .back-face .sym { font-size: calc(var(--cw) * 0.30); font-weight: 700; line-height: 1; opacity: .5; }
  .back-en {
    position: absolute; left: 0; right: 0; top: 70%;
    font-size: calc(var(--cw) * 0.055); letter-spacing: .45em; text-indent: .45em;
    text-align: center; opacity: .7;
  }
  .card.back.chance { color: #fff; }
  .card.back.fate { color: #2C3E6B; }
  .back-stamp {
    position: absolute;
    top: calc(var(--ch) * 0.07);
    left: calc(var(--cw) * 0.04);
    width: calc(var(--cw) * 0.24); height: calc(var(--cw) * 0.16);
    transform: rotate(-12deg);
    opacity: .85;
    pointer-events: none;
  }
  .back-stamp circle, .back-stamp ellipse {
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-dasharray: 6 5; opacity: .88;
  }
  .back-stamp text {
    fill: currentColor; font-weight: 700;
    font-size: calc(var(--cw) * 0.048);
    text-anchor: middle; dominant-baseline: central;
  }
  .back-ver {
    position: absolute; right: 5.5%; bottom: 5.5%;
    font-size: calc(var(--cw) * 0.058); letter-spacing: .18em;
    opacity: .82; pointer-events: none;
    display: flex; align-items: center; gap: calc(var(--cw) * 0.012);
  }
  .devil {
    width: calc(var(--cw) * 0.10); height: auto; flex: none;
    fill: currentColor;
  }

  @media print {
    body { background: #fff; }
    .chrome { display: none !important; }
    .wrap { padding: 0; }
    .page-tag { display: none; }
    .sheet { margin: 0; box-shadow: none; overflow: hidden; }
  }
</style>
<style id="pageStyle">@page { size: A4 portrait; margin: 0; }</style>
</head>

function splitOnce(t) {
  const i = t.indexOf('：');
  return i < 0 ? [t, ''] : [t.slice(0, i), t.slice(i + 1)];
}
function cardNode(card, idxInDeck) {
  let inner;
  if (card.cond) {
    inner = '<div class="ev">' + card.t + '</div>' +
      '<div class="sub">' +

      '<div class="line"><span class="out win">' + faceSVG('smile') + '</span><span class="out win">赢：' + card.win + '</span></div>' +
      '<div class="line"><span class="out lose">' + faceSVG('frown') + '</span><span class="out lose">输：' + card.lose + '</span></div>' +
      '</div>';
  } else {
    const [ev, ef] = splitOnce(card.t);
    inner = '<div class="ev">' + ev + '</div>' +
      (ef ? '<div class="line"><span class="ef">' + faceSVG(card.s || 'smile') + '</span><span class="ef">' + ef + '</span></div>' : '');
  }
  const el = document.createElement('div');
  el.className = 'card ' + card.c;
  el.innerHTML =
    '<div class="wm">' + (card.c === 'chance' ? '?' : '!') + '</div>' +
    '<div class="num">' + (idxInDeck + 1) + '-20</div>' +
    '<div class="title">' + DECK_NAME[card.c] + '</div>' +
    '<div class="txt">' + inner + '</div>';
  return el;
}
function deckList(kind) {
  return CARDS.filter(c => c.c === kind).map((c, i) => ({ card: c, i }));
}

// ===== 卡牌背面：同色底 + 双线内框 + 「机?会/命!运」中央构图 + 斜章 + 邪恶版 =====
function backNode(kind) {
  const isChance = kind === 'chance';
  const w1 = isChance ? '机' : '命';
  const w2 = isChance ? '会' : '运';
  const sym = isChance ? '?' : '!';
  const en = isChance ? 'CHANCE' : 'FATE';
  const el = document.createElement('div');
  el.className = 'card back ' + kind;
  el.innerHTML =
    '<div class="back-frame"></div>' +
    '<div class="back-stamp"><svg viewBox="0 0 48 32">' +
      '<ellipse cx="24" cy="16" rx="22" ry="14"/>' +
      '<text x="24" y="16">大富翁</text>' +
    '</svg></div>' +
    '<div class="back-face"><span class="w">' + w1 + '</span><span class="sym">' + sym + '</span><span class="w">' + w2 + '</span></div>' +
    '<div class="back-en">' + en + '</div>' +
    '<div class="back-ver"><svg class="devil" viewBox="0 0 40 36">' +
      '<path d="M8 8 Q6 2 11 0 Q10 6 14 8 Z"/>' +
      '<path d="M32 8 Q34 2 29 0 Q30 6 26 8 Z"/>' +
      '<path d="M20 6 C11 6 5 12 5 19 C5 26 11 30 20 30 C29 30 35 26 35 19 C35 12 29 6 20 6 Z"/>' +
      '<path d="M12 17 Q15 14 18 17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>' +
      '<path d="M22 17 Q25 14 28 17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>' +
      '<path d="M13 21 Q20 27 27 21" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>' +
    '</svg></div>';
  return el;
}

function render() {
  const L = activeLayout();
  const P = PAPERS[currentPaper];
  const split = pageMode === 'split' || side === 'back'; // 背面强制按花色分页（整页同色，翻面不错格）
  const pages = [];
  if (split) {
    ['chance', 'fate'].forEach(kind => {
      const list = deckList(kind);
      for (let i = 0; i < list.length; i += L.per) pages.push(list.slice(i, i + L.per));
    });
  } else {
    const flow = deckList('chance').concat(deckList('fate'));
    for (let i = 0; i < flow.length; i += L.per) pages.push(flow.slice(i, i + L.per));
  }

  const wrap = document.getElementById('wrap');
  wrap.innerHTML = '';
  pages.forEach((pageItems, pi) => {
    const tag = document.createElement('div');
    tag.className = 'page-tag';
    tag.style.width = P.w + 'mm';
    const kinds = [...new Set(pageItems.map(x => DECK_NAME[x.card.c]))].join(' + ');
    tag.textContent = '第 ' + (pi + 1) + ' 页 / 共 ' + pages.length + ' 页 · ' + kinds + '牌' +
      (side === 'back' ? ' · 背面（对背打印，先印正面再翻面印本页）' : '');
    wrap.appendChild(tag);

    const sheet = document.createElement('div');
    sheet.className = 'sheet';
    sheet.style.width = P.w + 'mm';
    sheet.style.height = P.h + 'mm';
    sheet.style.setProperty('--cw', L.cw + 'mm');
    sheet.style.setProperty('--ch', L.ch + 'mm');
    sheet.style.setProperty('--gx', L.gx + 'mm');
    sheet.style.setProperty('--gy', L.gy + 'mm');
    sheet.style.setProperty('--mx', L.mx + 'mm');
    sheet.style.setProperty('--my', L.my + 'mm');
    sheet.style.setProperty('--tfs', L.tfs + 'px');
    sheet.style.setProperty('--evfs', L.evfs + 'px');
    sheet.style.setProperty('--effs', L.effs + 'px');
    sheet.style.setProperty('--nfs', L.nfs + 'px');
    sheet.style.setProperty('--wms', L.wms + 'mm');

    pageItems.forEach(x => sheet.appendChild(side === 'back' ? backNode(x.card.c) : cardNode(x.card, x.i)));
    for (let k = pageItems.length; k < L.per; k++) {
      const b = document.createElement('div');
      b.className = 'blank';
      b.textContent = '备用';
      sheet.appendChild(b);
    }
    wrap.appendChild(sheet);
  });
  autoFit();
  updateSpecs(pages.length);
}

// 内容超出正文区（纵向或横向）就整体缩字号，保证不贴边、不溢出
function autoFit() {
  document.querySelectorAll('.txt').forEach(txt => {
    const nodes = [...txt.querySelectorAll('.ev, .ef, .cond, .out')];
    if (!nodes.length) return;
    const base = nodes.map(n => parseFloat(getComputedStyle(n).fontSize) || 10);
    let k = 0;
    while ((txt.scrollHeight > txt.clientHeight + 1 || txt.scrollWidth > txt.clientWidth + 1) && k < 60) {
      k++;
      nodes.forEach((n, i) => { n.style.fontSize = Math.max(5.2, base[i] - k * 0.3) + 'px'; });
    }
  });
}

function updateSpecs(pageCount) {
  const L = activeLayout();
  const P = PAPERS[currentPaper];
  const rows = L.per / L.cols;
  const split = pageMode === 'split' || side === 'back';
  const modeText = side === 'back'
    ? '按花色分页（背面模式自动锁定，整页同色）'
    : (pageMode === 'flow' ? '连着排（机会接命运，不留空位）' : '按花色分页（每花色独立分页）');
  document.getElementById('specs').innerHTML =
    '<span>纸张 <b>' + P.name + '（' + P.w + ' × ' + P.h + ' mm）</b></span>' +
    '<span>卡片尺寸 <b>' + L.cw + ' × ' + L.ch + ' mm</b></span>' +
    '<span>版式 <b>' + L.cols + ' 列 × ' + rows + ' 行 = ' + L.per + ' 张/页</b></span>' +
    '<span>分页 <b>' + modeText + '</b></span>' +
    '<span>共 <b>' + CARDS.length + ' 张 → ' + pageCount + ' 页</b></span>';
}

function syncPaperUI() {
  const isPhoto = currentPaper === 'photo6';
  document.getElementById('pageStyle').textContent =
    '@page { size: ' + PAPERS[currentPaper].css + '; margin: 0; }';
  document.getElementById('tip').textContent = side === 'back'
    ? '背面模式：自动按花色分页（整页同色，翻面不错格）。流程 = 先印正面 → 翻面 → 印背面（页数与格子一一对齐）。' + PAPERS[currentPaper].tip
    : PAPERS[currentPaper].tip;
  document.querySelectorAll('.btn[data-layout]').forEach(b => b.classList.toggle('off', isPhoto));
  // 背面强制按花色分页，锁定分页按钮
  document.querySelectorAll('.btn[data-mode]').forEach(b => b.classList.toggle('off', side === 'back'));
}

document.querySelectorAll('.btn[data-paper]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.btn[data-paper]').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    currentPaper = b.dataset.paper;
    syncPaperUI();
    render();
  });
});
document.querySelectorAll('.btn[data-layout]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.btn[data-layout]').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    currentLayout = b.dataset.layout;
    render();
  });
});
document.querySelectorAll('.btn[data-mode]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.btn[data-mode]').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    pageMode = b.dataset.mode;
    render();
  });
});
document.querySelectorAll('.btn[data-side]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.btn[data-side]').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    side = b.dataset.side;
    syncPaperUI();
    render();
  });
});
document.getElementById('doPrint').addEventListener('click', () => window.print());

syncPaperUI();
render();
</script>
</body>
</html>
