<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>大富翁卡牌打印版 · A4</title>
<style>
  @page { size: A4 portrait; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #1c1c1e; font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }

  .chrome { background: #232327; border-bottom: 1px solid #3a3a40; padding: 14px 20px; color: #e8e8e8; position: sticky; top: 0; z-index: 10; }
  .chrome h1 { font-size: 15px; font-weight: 500; margin: 0 0 4px; }
  .chrome p { font-size: 12px; color: #9a9aa2; margin: 0 0 12px; line-height: 1.6; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn { background: #32323a; color: #dcdce2; border: 0.5px solid #4a4a52; border-radius: 8px; padding: 7px 13px; font-size: 12.5px; cursor: pointer; font-family: inherit; }
  .btn:hover { border-color: #6a6a72; }
  .btn.on { background: #0F6E56; border-color: #1D9E75; color: #E1F5EE; }
  .btn.print { background: #D94F6E; border-color: #E8738C; color: #fff; }
  label.chk { font-size: 12.5px; color: #b9b9c0; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .specs { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 18px; font-size: 12px; color: #9a9aa2; }
  .specs b { color: #e8e8e8; font-weight: 500; }

  .wrap { padding: 24px 0 60px; }
  .page-tag { width: 210mm; margin: 0 auto 6px; font-size: 11.5px; color: #7a7a82; letter-spacing: .3px; }
  .sheet {
    width: 210mm; height: 297mm; background: #fff; margin: 0 auto 22px;
    padding: var(--my) var(--mx);
    display: flex; flex-wrap: wrap; align-content: flex-start;
    gap: var(--gy) var(--gx);
    page-break-after: always; break-after: page;
    box-shadow: 0 2px 10px rgba(0,0,0,.4);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .sheet:last-child { page-break-after: auto; break-after: auto; }

  .card {
    width: var(--cw); height: var(--ch);
    border-radius: 2.6mm;
    display: flex; flex-direction: column; align-items: center;
    padding: 2mm 2.4mm 4.5mm;
    position: relative; overflow: hidden;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .card.chance { background: #B06F88; color: #fff; }
  .card.fate { background: #D9BA8E; color: #2C3E6B; }
  .wm {
    position: absolute; right: 0.8mm; top: 13%;
    font-size: var(--wms); line-height: 1; font-weight: 700;
    pointer-events: none;
  }
  .card.chance .wm { color: #C79AAC; }
  .card.fate .wm { color: #ECDCBE; }
  .title {
    flex: none; font-size: var(--tfs); font-weight: 700; line-height: 1.15;
    letter-spacing: .28em; margin-right: -.28em;
    margin-top: .5mm; margin-bottom: 2.5mm;
  }
  .txt {
    flex: 1; min-height: 0; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2mm; text-align: center; overflow: hidden;
  }
  .ev { font-size: var(--evfs); font-weight: 700; line-height: 1.42; }
  .ef { font-size: var(--effs); font-weight: 500; line-height: 1.42; }
  .num { position: absolute; left: 2.2mm; bottom: 1mm; font-size: var(--nfs); letter-spacing: .5px; font-weight: 500; }
  .card.chance .num { color: rgba(40,18,28,.8); }
  .card.fate .num { color: rgba(35,30,25,.75); }
  .blank { background: repeating-linear-gradient(45deg, #fafafa, #fafafa 4px, #f2f2f2 4px, #f2f2f2 8px); border: 1px dashed #ddd; border-radius: 2.6mm; width: var(--cw); height: var(--ch); display: flex; align-items: center; justify-content: center; color: #c4c4c4; font-size: var(--evfs); }

  @media print {
    body { background: #fff; }
    .chrome { display: none !important; }
    .wrap { padding: 0; }
    .page-tag { display: none; }
    .sheet { margin: 0; box-shadow: none; overflow: hidden; }
  }
</style>
</head>
<body>

<div class="chrome">
  <h1>大富翁卡牌打印版 · A4</h1>
  <p>选好版式后点「打印」；打印设置里纸张选 A4、边距选「无」、缩放 100%（不要选「适应页面」），并勾选「背景图形」。黑白打印机也能用，只是颜色会变灰。</p>
  <div class="row">
    <button class="btn on" data-layout="standard">标准 · 9 张/页</button>
    <button class="btn" data-layout="compact">紧凑 · 12 张/页</button>
    <button class="btn" data-layout="mini">迷你 · 16 张/页</button>
    <label class="chk"><input type="checkbox" id="groupDeck" checked> 按花色分页（机会在前，命运在后）</label>
    <button class="btn print" id="doPrint">打印</button>
  </div>
  <div class="specs" id="specs"></div>
</div>

<div class="wrap" id="wrap"></div>

<script>
const CARDS = [
  { c: 'chance', t: '你买的国足赢了世界杯：+3000' },
  { c: 'chance', t: '你与马来西亚农民一起种植油棕：+2000' },
  { c: 'chance', t: '你在马里亚纳海沟钓到了深海克苏鲁：+1000' },
  { c: 'chance', t: '你的航班延误了，获得赔偿+500' },
  { c: 'chance', t: '你在家里的厕所挖到了古董：+500' },
  { c: 'chance', t: '你在珠穆朗玛峰成功救下了一个富豪：+500' },
  { c: 'chance', t: '今天你生日，每个玩家给你发红包：+200*N' },
  { c: 'chance', t: '你在埃及找到了一支野生的工程队：下一回合到达的地块免费升级一次' },
  { c: 'chance', t: '你在中国乘坐磁悬浮列车：+1骰子次数' },
  { c: 'chance', t: '你假冒FBI查房：向所有玩家收取过路费（所有玩家触发一次当前格子的过路费，钱给你）' },
  { c: 'chance', t: '你在缅甸遭遇诈骗：摇一次骰子，强制拍卖该处房子' },
  { c: 'chance', t: '你前往加拿大的海上遇到了飓风：+1骰子次数，向后移动' },
  { c: 'chance', t: '你在日本遭遇地震：-500' },
  { c: 'chance', t: '你在古巴遭受袭击：-500' },
  { c: 'chance', t: '你在南非买了大象：-1000' },
  { c: 'chance', t: '你在冰岛种植橡胶树：-2000' },
  { c: 'chance', t: '你在迪拜淘到一辆二手超跑，转手卖出：+2500' },
  { c: 'chance', t: '你在挪威钓到三文鱼王，被海鲜商高价收购：+1500' },
  { c: 'chance', t: '你在泰国成为人妖秀头牌，全场观众给你打赏：+300*N' },
  { c: 'chance', t: '你成为首位平民太空旅客，NASA 发放补贴：+2000，并 +1 骰子次数' },
  { c: 'fate', t: '你存在瑞士的加密货币被黑客盗取了：-3000' },
  { c: 'fate', t: '你在南极看企鹅的时候弄丢了手机：-2000' },
  { c: 'fate', t: '你在新加坡吸烟：-1000' },
  { c: 'fate', t: '你去墨尔本挖翡翠：-500' },
  { c: 'fate', t: '你去巴西观看世界杯：-500' },
  { c: 'fate', t: '你请所有人去韩国吃烤肉：-200*N' },
  { c: 'fate', t: '你在叙利亚被导弹锁定了：下一回合到达的地块降级一次' },
  { c: 'fate', t: '你在美国跟牛仔决斗：摇一次骰子猜大小，输了把你送进监狱3回合，赢了+3000' },
  { c: 'fate', t: '你在印度用左手吃饭，因吃坏肚子重新出生了：回到出生点（没有奖励）' },
  { c: 'fate', t: '你在澳大利亚被外星人绑架了：跳过下一个回合' },
  { c: 'fate', t: '你乘船通过巴拿马运河：+1骰子次数' },
  { c: 'fate', t: '你在澳门玩的很开心，给每个玩家发红包：-200*N' },
  { c: 'fate', t: '你在英国给旅行者当翻译：+500' },
  { c: 'fate', t: '你受邀至拉斯维加斯表演魔术：+500' },
  { c: 'fate', t: '你在俄罗斯捡到了钻石：+1000' },
  { c: 'fate', t: '你在墨西哥走私显卡：+2000' },
  { c: 'fate', t: '你在摩洛哥被导游宰客，全程都在交智商税：-2500' },
  { c: 'fate', t: '你在菲律宾潜水被水母蜇伤，住院治疗：-1000' },
  { c: 'fate', t: '你在美国被警察误认为通缉犯：送进监狱 2 回合' },
  { c: 'fate', t: '你在智利阿塔卡马沙漠迷路，GPS 失灵：取消下一次掷骰机会' }
];

const LAYOUTS = {
  standard: { label: '标准', per: 9,  cols: 3, cw: 63, ch: 88, gx: 4, gy: 4, mx: 6.5, my: 12,
              tfs: 36, evfs: 11, effs: 10.5, nfs: 8, wms: 48 },
  compact:  { label: '紧凑', per: 12, cols: 3, cw: 60, ch: 64, gx: 4, gy: 4, mx: 11, my: 14,
              tfs: 26, evfs: 9.5, effs: 9, nfs: 7.5, wms: 34 },
  mini:     { label: '迷你', per: 16, cols: 4, cw: 46, ch: 65, gx: 3, gy: 3, mx: 8.5, my: 13.5,
              tfs: 20, evfs: 8.5, effs: 8, nfs: 7, wms: 30 }
};

const DECK_NAME = { chance: '机会', fate: '命运' };
let current = 'standard';

function splitOnce(t) {
  const i = t.indexOf('：');
  return i < 0 ? [t, ''] : [t.slice(0, i), t.slice(i + 1)];
}
function cardNode(card, idxInDeck) {
  const [ev, ef] = splitOnce(card.t);
  const el = document.createElement('div');
  el.className = 'card ' + card.c;
  el.innerHTML =
    '<div class="wm">' + (card.c === 'chance' ? '？' : '！') + '</div>' +
    '<div class="title">' + DECK_NAME[card.c] + '</div>' +
    '<div class="txt"><div class="ev">' + ev + '</div>' +
    (ef ? '<div class="ef">' + ef + '</div>' : '') +
    '</div>' +
    '<div class="num">' + (idxInDeck + 1) + '-20</div>';
  return el;
}
function deckList(kind) {
  return CARDS.filter(c => c.c === kind).map((c, i) => ({ card: c, i }));
}

function render() {
  const L = LAYOUTS[current];
  const group = document.getElementById('groupDeck').checked;
  const pages = [];
  if (group) {
    ['chance', 'fate'].forEach(kind => {
      const list = deckList(kind);
      for (let i = 0; i < list.length; i += L.per) pages.push(list.slice(i, i + L.per));
    });
  } else {
    for (let i = 0; i < CARDS.length; i += L.per) {
      pages.push(CARDS.slice(i, i + L.per).map(c => ({ card: c, i: CARDS.filter(x => x.c === c.c).indexOf(c) })));
    }
  }

  const wrap = document.getElementById('wrap');
  wrap.innerHTML = '';
  pages.forEach((pageItems, pi) => {
    const tag = document.createElement('div');
    tag.className = 'page-tag';
    const kinds = [...new Set(pageItems.map(x => DECK_NAME[x.card.c]))].join(' + ');
    tag.textContent = '第 ' + (pi + 1) + ' 页 / 共 ' + pages.length + ' 页 · ' + kinds + '牌';
    wrap.appendChild(tag);

    const sheet = document.createElement('div');
    sheet.className = 'sheet';
    sheet.style.setProperty('--cw', L.cw + 'mm');
    sheet.style.setProperty('--ch', L.ch + 'mm');
    sheet.style.setProperty('--gx', L.gx + 'mm');
    sheet.style.setProperty('--gy', L.gy + 'mm');
    sheet.style.setProperty('--mx', L.mx + 'mm');
    sheet.style.setProperty('--my', L.my + 'mm');
    sheet.style.setProperty('--tfs', L.tfs + 'px');
    sheet.style.setProperty('--evfs', L.evfs + 'px');
    sheet.style.setProperty('--effs', L.effs + 'px');
    sheet.style.setProperty('--nfs', L.nfs + 'px');
    sheet.style.setProperty('--wms', L.wms + 'mm');

    pageItems.forEach(x => sheet.appendChild(cardNode(x.card, x.i)));
    for (let k = pageItems.length; k < L.per; k++) {
      const b = document.createElement('div');
      b.className = 'blank';
      b.textContent = '备用';
      sheet.appendChild(b);
    }
    wrap.appendChild(sheet);
  });
  autoFit();
  updateSpecs(pages.length);
}

function autoFit() {
  document.querySelectorAll('.txt').forEach(txt => {
    const evEl = txt.querySelector('.ev');
    const efEl = txt.querySelector('.ef');
    let evSize = parseFloat(getComputedStyle(evEl).fontSize) || 10;
    let efSize = efEl ? parseFloat(getComputedStyle(efEl).fontSize) : 0;
    let guard = 0;
    while (txt.scrollHeight > txt.clientHeight + 1 && evSize > 5.5 && guard < 40) {
      evSize -= 0.4; guard++;
      if (efEl) efSize = Math.max(5.5, efSize - 0.35);
      evEl.style.fontSize = evSize + 'px';
      if (efEl) efEl.style.fontSize = efSize + 'px';
    }
  });
}

function updateSpecs(pageCount) {
  const L = LAYOUTS[current];
  const rows = L.per / L.cols;
  document.getElementById('specs').innerHTML =
    '<span>卡片尺寸 <b>' + L.cw + ' × ' + L.ch + ' mm</b></span>' +
    '<span>版式 <b>' + L.cols + ' 列 × ' + rows + ' 行 = ' + L.per + ' 张/页</b></span>' +
    '<span>卡间距 <b>' + L.gx + ' mm</b></span>' +
    '<span>页边距 <b>左右 ' + L.mx + ' / 上下 ' + L.my + ' mm</b></span>' +
    '<span>共 <b>' + CARDS.length + ' 张 → ' + pageCount + ' 页 A4</b></span>';
}

document.querySelectorAll('.btn[data-layout]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.btn[data-layout]').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    current = b.dataset.layout;
    render();
  });
});
document.getElementById('groupDeck').addEventListener('change', render);
document.getElementById('doPrint').addEventListener('click', () => window.print());

render();
</script>
</body>
</html>
